<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nibir Code Runner — Mini Web IDE</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/monokai.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/eclipse.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/blackboard.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/material-darker.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/dialog/dialog.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/show-hint.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/fold/foldgutter.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/lint/lint.min.css">

<style>
:root{
  --bg:#1e1e1e; --bg2:#252526; --bg3:#2d2d30; --bg4:#3a3a3d;
  --border:#3c3c3c; --text:#d4d4d4; --dim:#9a9a9a;
  --accent:#0e7ad6; --accent2:#1a8fe3;
  --ok:#28a745; --warn:#f39c12; --err:#e74c3c;
  --preview-bg:#111111; --shadow:0 10px 30px rgba(0,0,0,.55);
  --c-log:#d4d4d4; --c-info:#61afef; --c-debug:#a0a0a0; --c-warn:#e5c07b; --c-error:#f48771; --c-system:#7ec699;
}
body[data-theme="light"]{
  --bg:#ffffff;--bg2:#f3f3f3;--bg3:#e8e8e8;--bg4:#dcdcdc;--border:#c9c9c9;--text:#1f1f1f;--dim:#5a5a5a;
  --accent:#0066b8;--accent2:#1a7fd4;--preview-bg:#d9d9d9;--shadow:0 10px 30px rgba(0,0,0,.2);
  --c-log:#1f1f1f; --c-info:#1a6fc4; --c-debug:#6b6b6b; --c-warn:#8a5d00; --c-error:#c0392b; --c-system:#1e7a3c;
}
body[data-theme="dracula"]{--bg:#282a36;--bg2:#21222c;--bg3:#343746;--bg4:#44475a;--border:#44475a;--text:#f8f8f2;--dim:#a8a8b3;--accent:#bd93f9;--accent2:#cba9fb;--preview-bg:#1a1b23;--c-info:#8be9fd;--c-warn:#f1fa8c;--c-error:#ff5555;--c-system:#50fa7b;--c-debug:#a8a8b3;}
body[data-theme="monokai"]{--bg:#272822;--bg2:#1e1f1c;--bg3:#34352f;--bg4:#43443c;--border:#49483e;--text:#f8f8f2;--dim:#a0a09a;--accent:#a6e22e;--accent2:#b8ef4b;--preview-bg:#191a16;--c-info:#66d9ef;--c-warn:#e6db74;--c-error:#f92672;--c-system:#a6e22e;}
body[data-theme="high-contrast"]{--bg:#000;--bg2:#0a0a0a;--bg3:#141414;--bg4:#242424;--border:#6a6a6a;--text:#fff;--dim:#c8c8c8;--accent:#ffd400;--accent2:#ffe14d;--preview-bg:#000;--c-info:#7cc4ff;--c-warn:#ffd400;--c-error:#ff6b6b;--c-system:#6bff8f;}

*{box-sizing:border-box;}
html,body{height:100%;margin:0;padding:0;}
body{font-family:'Segoe UI',Roboto,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;font-size:13px;line-height:1.4;background:var(--bg);color:var(--text);overflow:hidden;transition:background .2s,color .2s;}
button,input,select,textarea{font-family:inherit;font-size:12px;color:inherit;}
button{background:var(--bg3);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:5px 10px;cursor:pointer;transition:background .15s,border-color .15s,color .15s;white-space:nowrap;}
button:hover{background:var(--bg4);}
button:active{transform:translateY(1px);}
button:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
button.primary:hover{background:var(--accent2);border-color:var(--accent2);}
button.danger{color:var(--err);border-color:var(--err);}
button.danger:hover{background:var(--err);color:#fff;}
button.icon{padding:5px 8px;}
button.toggled{background:var(--accent);border-color:var(--accent);color:#fff;}
.hidden{display:none !important;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}
::-webkit-scrollbar{width:11px;height:11px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:6px;border:2px solid var(--bg);}
::-webkit-scrollbar-thumb:hover{background:var(--dim);}

#app{display:flex;flex-direction:column;height:100vh;width:100vw;}
#topbar{flex:0 0 auto;height:46px;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--bg2);border-bottom:1px solid var(--border);}
.brand{font-weight:800;letter-spacing:.6px;font-size:13px;white-space:nowrap;user-select:none;}
.brand em{color:var(--accent);font-style:normal;}
.topbar-actions{display:flex;align-items:center;gap:6px;margin-left:auto;flex-wrap:nowrap;overflow:hidden;}
.tb-sep{width:1px;height:22px;background:var(--border);margin:0 3px;}
#main{flex:1 1 auto;display:flex;min-height:0;min-width:0;}

#sidebar{flex:0 0 220px;width:220px;min-width:120px;display:flex;flex-direction:column;background:var(--bg2);border-right:1px solid var(--border);min-height:0;}
.panel-head{flex:0 0 auto;height:32px;display:flex;align-items:center;gap:6px;padding:0 8px;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--border);user-select:none;}
.panel-head .grow{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mini-btn{background:transparent;border:none;padding:2px 5px;border-radius:3px;color:var(--dim);font-size:13px;line-height:1;cursor:pointer;}
.mini-btn:hover{background:var(--bg4);color:var(--text);}
#tree-scroll{flex:1 1 auto;overflow:auto;padding:4px 4px 20px;}
#file-tree{display:flex;flex-direction:column;gap:1px;}
.tree-row{display:flex;align-items:center;gap:6px;padding:3px 6px;border-radius:4px;cursor:pointer;user-select:none;white-space:nowrap;overflow:hidden;font-size:12.5px;color:var(--text);}
.tree-row:hover{background:var(--bg4);}
.tree-row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;}
.tree-row.active{background:var(--accent);color:#fff;}
.tree-row.folder{color:var(--dim);font-weight:600;}
.tree-row .tname{overflow:hidden;text-overflow:ellipsis;}
.tree-row .ticon{flex:0 0 auto;width:16px;text-align:center;}
.tree-children{margin-left:12px;border-left:1px solid var(--border);padding-left:2px;}
.tree-drop{outline:2px dashed var(--accent);outline-offset:-2px;background:rgba(14,122,214,.12);}

.gutter-v{flex:0 0 5px;width:5px;cursor:col-resize;background:var(--border);transition:background .15s;}
.gutter-h{flex:0 0 5px;height:5px;cursor:row-resize;background:var(--border);transition:background .15s;}
.gutter-v:hover,.gutter-h:hover{background:var(--accent);}
body.resizing *{user-select:none !important;}
body.resizing iframe,body.resizing .CodeMirror{pointer-events:none;}

#center{flex:1 1 auto;display:flex;flex-direction:column;min-width:0;min-height:0;}
#editor-region{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;}
#editor-panes{flex:1 1 auto;display:flex;min-height:0;min-width:0;}
.editor-pane{flex:1 1 0;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg);}
body:not(.split-mode) #editor-pane-1,
body:not(.split-mode) #gutter-editor-split{display:none !important;}
body.split-mode #editor-pane-0{flex:.5;}
body.split-mode #editor-pane-1{flex:.5;}
body.split-mode #gutter-editor-split{display:block;}

.tabs-bar{flex:0 0 auto;display:flex;align-items:stretch;min-height:34px;background:var(--bg2);border-bottom:1px solid var(--border);overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;}
.tab{display:flex;align-items:center;gap:6px;padding:0 8px 0 11px;border-right:1px solid var(--border);cursor:pointer;font-size:12.5px;color:var(--dim);white-space:nowrap;position:relative;transition:background .12s,color .12s;border:none;border-radius:0;background:transparent;}
.tab:hover{background:var(--bg3);color:var(--text);}
.tab.active{background:var(--bg);color:var(--text);}
.tab.active::before{content:'';position:absolute;left:0;right:0;top:0;height:2px;background:var(--accent);}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;}
.tab .dot{width:7px;height:7px;border-radius:50%;background:var(--warn);display:none;}
.tab.dirty .dot{display:inline-block;}
.tab-close{background:transparent;border:none;padding:1px 4px;border-radius:3px;font-size:11px;color:inherit;opacity:.55;line-height:1;}
.tab-close:hover{background:var(--bg4);opacity:1;}
.tab-add{background:transparent;border:none;padding:0 12px;color:var(--dim);font-size:16px;cursor:pointer;align-self:stretch;}
.tab-add:hover{background:var(--bg3);color:var(--text);}

.editor-host{flex:1 1 auto;min-height:0;position:relative;background:var(--bg);}
.editor-host .CodeMirror{position:absolute;inset:0;height:100% !important;}
.editor-host .CodeMirror-focused{outline:none;}
.editor-host.empty::before{content:'No file open. Click a tab or a file in the explorer.';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:var(--dim);font-style:italic;font-size:12.5px;pointer-events:none;opacity:.6;}
.editor-pane.focused .editor-host{box-shadow:inset 0 0 0 1px rgba(14,122,214,.22);}
#editor-fallback{padding:18px;color:var(--err);font-family:monospace;}

#bottom-panel{flex:0 0 175px;display:flex;flex-direction:column;min-height:0;background:var(--bg2);border-top:1px solid var(--border);}
#panel-tabs{flex:0 0 auto;display:flex;align-items:center;gap:2px;height:32px;padding:0 6px;border-bottom:1px solid var(--border);}
.panel-tab{padding:4px 10px;font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--dim);cursor:pointer;border-radius:3px;user-select:none;background:transparent;border:none;}
.panel-tab:hover{background:var(--bg3);color:var(--text);}
.panel-tab.active{color:var(--text);background:var(--bg3);}
.panel-tab .badge{display:inline-block;margin-left:6px;background:var(--err);color:#fff;border-radius:8px;padding:0 5px;font-size:10px;line-height:14px;}
.panel-actions{margin-left:auto;display:flex;gap:4px;}
.panel-body{flex:1 1 auto;min-height:0;position:relative;}
.panel-view{position:absolute;inset:0;overflow:auto;display:none;padding:4px 0;}
.panel-view.active{display:block;}
.panel-empty{padding:14px;color:var(--dim);font-style:italic;font-size:12px;}

.console-line{display:flex;gap:8px;padding:2px 12px;font-family:Consolas,'Fira Code',monospace;font-size:12px;border-bottom:1px solid rgba(128,128,128,.08);white-space:pre-wrap;word-break:break-word;}
.console-line .marker{flex:0 0 auto;opacity:.9;}
.console-line.log{color:var(--c-log);}
.console-line.info{color:var(--c-info);}
.console-line.debug{color:var(--c-debug);}
.console-line.warn{color:var(--c-warn);}
.console-line.error{color:var(--c-error);}
.console-line.system{color:var(--c-system);font-style:italic;}
.console-line.system .marker{font-style:normal;}
.console-line.clickable{cursor:pointer;}
.console-line.clickable:hover{background:rgba(128,128,128,.12);}

.problem-item{display:flex;gap:10px;padding:6px 12px;cursor:pointer;border-bottom:1px solid rgba(128,128,128,.08);font-size:12px;align-items:flex-start;position:relative;}
.problem-item:hover{background:rgba(128,128,128,.12);}
.problem-item .pico{flex:0 0 auto;padding-top:1px;}
.problem-item .pmsg{flex:1 1 auto;color:var(--text);word-break:break-word;}
.problem-item .ploc{flex:0 0 auto;color:var(--dim);font-family:Consolas,monospace;font-size:11px;}
.problem-item .pfix{
  flex:0 0 auto;background:var(--ok);border:1px solid var(--ok);color:#fff;
  font-size:11px;padding:2px 8px;border-radius:3px;cursor:pointer;font-weight:600;
  white-space:nowrap;margin-left:6px;
}
.problem-item .pfix:hover{filter:brightness(1.1);}
.problem-item .pfix.disabled{background:var(--bg4);border-color:var(--border);color:var(--dim);cursor:default;}
.problem-item .pfix.disabled:hover{filter:none;}

#preview-region{flex:0 0 42%;min-width:160px;display:flex;flex-direction:column;background:var(--bg2);border-left:1px solid var(--border);min-height:0;}
#preview-region:fullscreen{background:var(--bg);border:none;}
#preview-toolbar{flex:0 0 auto;height:32px;display:flex;align-items:center;gap:4px;padding:0 8px;border-bottom:1px solid var(--border);overflow-x:auto;}
#preview-toolbar .grow{flex:1 1 auto;}
.dev-btn{background:transparent;border:1px solid transparent;padding:3px 7px;border-radius:3px;color:var(--dim);font-size:12px;cursor:pointer;}
.dev-btn:hover{background:var(--bg3);color:var(--text);}
.dev-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.dev-btn.stop{color:var(--err);}
.dev-btn.stop:hover{background:var(--err);color:#fff;}
#preview-host{flex:1 1 auto;min-height:0;display:flex;justify-content:center;overflow:auto;background:var(--preview-bg);padding:0;}
#preview-host[data-device="desktop"] #preview-frame{width:100%;}
#preview-host[data-device="tablet"] #preview-frame{width:768px;max-width:100%;}
#preview-host[data-device="mobile"] #preview-frame{width:375px;max-width:100%;}
#preview-frame{border:none;background:#fff;height:100%;display:block;transition:width .18s ease;}

#statusbar{flex:0 0 auto;height:24px;display:flex;align-items:center;gap:14px;padding:0 12px;background:var(--bg2);border-top:1px solid var(--border);font-size:11.5px;color:var(--dim);user-select:none;overflow:hidden;}
#statusbar .s-item{white-space:nowrap;}
#statusbar .grow{flex:1 1 auto;}
#status-save.saved{color:var(--ok);}
#status-save.unsaved{color:var(--warn);}
#status-save.error{color:var(--err);}

#modal-layer{position:fixed;inset:0;z-index:900;pointer-events:none;}
.modal-overlay{position:absolute;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-start;justify-content:center;padding-top:8vh;pointer-events:auto;animation:fadeIn .12s ease;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{width:min(600px,92vw);max-height:80vh;display:flex;flex-direction:column;background:var(--bg2);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);animation:popIn .14s ease;}
@keyframes popIn{from{transform:translateY(-8px);opacity:.6}to{transform:none;opacity:1}}
.modal-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--border);font-weight:600;font-size:13px;}
.modal-head .modal-x{margin-left:auto;background:transparent;border:none;color:var(--dim);cursor:pointer;font-size:14px;padding:2px 6px;border-radius:3px;}
.modal-head .modal-x:hover{background:var(--bg4);color:var(--text);}
.modal-body{padding:14px;overflow:auto;font-size:13px;}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 14px;border-top:1px solid var(--border);}
.modal input[type="text"],.modal input[type="search"],.modal select{width:100%;padding:7px 10px;border-radius:4px;border:1px solid var(--border);background:var(--bg);color:var(--text);outline:none;}
.modal input[type="text"]:focus,.modal input[type="search"]:focus,.modal select:focus{border-color:var(--accent);}
.field-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid rgba(128,128,128,.12);}
.field-row:last-child{border-bottom:none;}
.field-row label{flex:1 1 auto;font-size:12.5px;}
.field-row select,.field-row input[type="number"]{width:auto;min-width:110px;flex:0 0 auto;}
.field-row input[type="checkbox"]{width:16px;height:16px;accent-color:var(--accent);}
.modal-section-title{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);margin:14px 0 4px;font-weight:700;}
.modal-section-title:first-child{margin-top:0;}

#palette-overlay,#quickopen-overlay{position:fixed;inset:0;z-index:950;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding-top:10vh;}
#palette,#quickopen{width:min(620px,92vw);background:var(--bg2);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;max-height:70vh;}
#palette input,#quickopen input{width:100%;border:none;border-bottom:1px solid var(--border);background:var(--bg2);color:var(--text);padding:14px 16px;font-size:14px;outline:none;}
#palette-list,#quickopen-list{overflow:auto;padding:6px;}
.palette-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:4px;cursor:pointer;font-size:13px;}
.palette-item:hover,.palette-item.sel{background:var(--accent);color:#fff;}
.palette-item .p-hint{margin-left:auto;font-size:11px;opacity:.7;}
.palette-item .p-cat{font-size:10px;opacity:.65;text-transform:uppercase;letter-spacing:.5px;}
.palette-item .p-path{font-size:11px;opacity:.7;margin-left:auto;}

.search-result{display:flex;gap:10px;padding:6px 10px;border-radius:4px;cursor:pointer;font-size:12px;align-items:baseline;}
.search-result:hover{background:var(--bg3);}
.search-result .sr-file{color:var(--accent);font-weight:600;flex:0 0 auto;}
.search-result .sr-line{color:var(--dim);font-family:Consolas,monospace;flex:0 0 auto;}
.search-result .sr-text{color:var(--text);opacity:.85;font-family:Consolas,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 auto;}
.search-result mark{background:rgba(243,156,18,.45);color:inherit;border-radius:2px;}

.shortcut-grid{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:12.5px;}
.shortcut-grid .kbd{font-family:Consolas,monospace;background:var(--bg3);border:1px solid var(--border);border-radius:3px;padding:2px 7px;font-size:11.5px;white-space:nowrap;color:var(--text);text-align:center;display:inline-block;}
.shortcut-grid .desc{color:var(--dim);align-self:center;}

#toasts{position:fixed;right:16px;bottom:38px;z-index:990;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none;}
.toast{background:var(--bg3);border:1px solid var(--border);border-left:3px solid var(--accent);color:var(--text);padding:9px 14px;border-radius:5px;font-size:12.5px;box-shadow:var(--shadow);animation:toastIn .18s ease;max-width:340px;}
.toast.ok{border-left-color:var(--ok);}
.toast.warn{border-left-color:var(--warn);}
.toast.err{border-left-color:var(--err);}
.toast.out{animation:toastOut .25s ease forwards;}
@keyframes toastIn{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes toastOut{to{transform:translateX(24px);opacity:0}}

#context-menu{position:fixed;z-index:980;background:var(--bg3);border:1px solid var(--border);border-radius:6px;box-shadow:var(--shadow);padding:5px;min-width:170px;}
.ctx-item{padding:6px 12px;border-radius:4px;cursor:pointer;font-size:12.5px;white-space:nowrap;}
.ctx-item:hover{background:var(--accent);color:#fff;}
.ctx-item.danger{color:var(--err);}
.ctx-item.danger:hover{background:var(--err);color:#fff;}
.ctx-sep{height:1px;background:var(--border);margin:4px 2px;}

#welcome{position:fixed;inset:0;z-index:800;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto;}
.welcome-card{width:min(680px,100%);text-align:center;}
.welcome-card h1{font-size:34px;margin:0 0 6px;letter-spacing:1px;}
.welcome-card h1 em{color:var(--accent);font-style:normal;}
.welcome-card .tagline{color:var(--dim);margin:0 0 26px;font-size:14px;letter-spacing:2px;text-transform:uppercase;}
.welcome-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:32px;}
.welcome-actions button{padding:10px 22px;font-size:13px;}
.recent-head{text-align:left;font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim);margin-bottom:8px;font-weight:700;}
.recent-list{display:flex;flex-direction:column;gap:6px;text-align:left;}
.recent-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:6px;background:var(--bg2);border:1px solid var(--border);cursor:pointer;transition:border-color .15s,background .15s;}
.recent-item:hover{border-color:var(--accent);background:var(--bg3);}
.recent-item .ri-name{font-weight:600;}
.recent-item .ri-meta{margin-left:auto;color:var(--dim);font-size:11.5px;}
.recent-empty{color:var(--dim);font-style:italic;font-size:12.5px;padding:6px 2px;}

body.zen-mode #topbar,body.zen-mode #sidebar,body.zen-mode #gutter-sidebar,body.zen-mode #preview-region,body.zen-mode #gutter-main,body.zen-mode #bottom-panel,body.zen-mode #gutter-console,body.zen-mode #statusbar{display:none !important;}
body.zen-mode #center{flex:1 1 auto;}
body.zen-mode .editor-host{background:#0a0a0a;}

/* ================================================================

   ================================================================ */
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));

function uid() { return 'f' + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4); }
function escapeHtml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeRegExp(s) { return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function debounce(fn, ms) { let t=null; return function(){ const a=arguments, self=this; clearTimeout(t); t=setTimeout(()=>fn.apply(self,a),ms); }; }
function clamp(v,mn,mx){ return Math.min(mx,Math.max(mn,v)); }
function extOf(n){ const i=n.lastIndexOf('.'); return i<0?'':n.slice(i+1).toLowerCase(); }
function baseName(p){ const i=p.lastIndexOf('/'); return i<0?p:p.slice(i+1); }
function dirName(p){ const i=p.lastIndexOf('/'); return i<0?'':p.slice(0,i); }
function kindOf(n){ const e=extOf(n); if(e==='html'||e==='htm') return 'html'; if(e==='css') return 'css'; if(e==='js'||e==='mjs'||e==='jsx') return 'javascript'; if(e==='json') return 'json'; return 'text'; }
function typeOf(n){ return FILE_TYPES[kindOf(n)] || FILE_TYPES.text; }
function cmMode(n){ return typeOf(n).cmMode; }
function isExternalUrl(u){ return /^(https?:)?\/\//i.test(u)||/^data:/i.test(u)||/^blob:/i.test(u); }
function sanitizeFileName(n){ return String(n||'project').replace(/[\\/:*?"<>|]+/g,'-').trim()||'project'; }
function sanitizeProjectPath(n){
  let s=String(n||'').replace(/\\/g,'/').replace(/^\/+/, '');
  return s.split('/').filter(Boolean).filter(p=>p!=='.' && p!=='..').join('/');

  const d=new Date(ts), today=new Date();
  if(d.toDateString()===today.toDateString()) return 'Today '+d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});

  if(n<1024) return n+' B';

/* Subsequence fuzzy match — returns a score or -1. Higher is better. */
function fuzzyScore(needle, hay){
  if(!needle) return 0;
  needle=needle.toLowerCase(); hay=hay.toLowerCase();
  let hi=0, score=0, streak=0, lastMatch=-2;
  for(let ni=0; ni<needle.length; ni++){
    const c=needle[ni];
    let found=-1;
    for(let i=hi; i<hay.length; i++){ if(hay[i]===c){ found=i; break; } }
    if(found===-1) return -1;
    streak = (found===lastMatch+1) ? streak+1 : 0;
    score += 10 + streak*8;
    if(found===0 || hay[found-1]==='/' || hay[found-1]==='.' || hay[found-1]==='-') score += 12;
    score -= Math.min(6, found-hi);
    lastMatch=found; hi=found+1;
  }
  score -= Math.max(0, hay.length-needle.length)*0.4;
  return score;
}

    const btnHTML=(opts.buttons||[]).map((b,i)=>`<button data-idx="${i}" class="${b.primary?'primary':''} ${b.danger?'danger':''}">${escapeHtml(b.label)}</button>`).join('');
    ov.innerHTML='<div class="modal" role="dialog" aria-modal="true" tabindex="-1"><div class="modal-head">'+escapeHtml(opts.title||'')+'<button class="modal-x" aria-label="Close">✕</button></div><div class="modal-body">'+(opts.bodyHTML||'')+'</div>'+(btnHTML?'<div class="modal-foot">'+btnHTML+'</div>':'')+'</div>';

    });
    if(opts.onMount) opts.onMount(ov.querySelector('.modal-body'),close);
    const fi=ov.querySelector('input, select, textarea');

/* lintResults keyed by file id. Runtime annotations are merged in and survive

const lintResults=new Map();

function mergeRuntimeAnnotations(fid, fresh){
  const prev = lintResults.get(fid) || [];

  prev.forEach(a=>{ if(a.runtime) out.push(a); });

}

function runLinter(text, options, cm){
  const fid = docFileId(cm);

  const res = mergeRuntimeAnnotations(fid, lintContent(f.name, text) || []);
  lintResults.set(fid, res);
  scheduleProblemsRebuild();

}
function lintAllFiles(){
  state.files.forEach(f=>{
    if(kindOf(f.name)==='text'){ lintResults.delete(f.id); return; }
    try { lintResults.set(f.id, mergeRuntimeAnnotations(f.id, lintContent(f.name, f.doc.getValue()) || [])); }
    catch(e){ lintResults.set(f.id, mergeRuntimeAnnotations(f.id, [])); }

function clearRuntimeAnnotations(){
  lintResults.forEach((anns, fid)=>{

function levenshtein(a, b){

  for(let i = 1; i <= m; i++){
    curr[0] = i;
    for(let j = 1; j <= n; j++){
      const cost = a.charCodeAt(i-1) === b.charCodeAt(j-1) ? 0 : 1;
      curr[j] = Math.min(prev[j] + 1, curr[j-1] + 1, prev[j-1] + cost);

    for(let j = 0; j <= n; j++) prev[j] = curr[j];

  COMMON_CSS_PROPS.forEach(p => { const d = levenshtein(name, p); if(d < bd){ bd = d; best = p; } });

  const out = lineText.replace(new RegExp('\\s+' + escapeRegExp(attr) + '\\s*=\\s*("[^"]*"|\'[^\']*\'|\\S+)', 'gi'),

  return out !== lineText ? { text: out, note: 'Removed duplicate "' + attr + '"' } : null;
}
function tryFixHtmlDuplicateId(lineText, msg){
  /* Renaming an id can silently break CSS selectors, labels, anchors, and JavaScript.
     Report it, but never change it automatically. */
  return null;
}
function tryFixHtmlDoctype(fullText){
  if(/^\s*<!doctype\s+html/i.test(fullText)) return null;
  return { text: '<!DOCTYPE html>\n' + fullText, wholeFile: true, note: 'Added <!DOCTYPE html>' };
}

/* ---- JS fixers ---- */
function tryFixJsKeywordTypo(lineText, msg){
  if(!/unexpected|reserved|keyword|identifier|missing/i.test(msg || '')) return null;
  let changed = false;
  /* Only fix tokens in statement position, and never an identifier being assigned to. */
  const out = lineText.replace(
    /(^|[;{}]\s*|\b(?:else|do|return)\s+)([a-zA-Z_$][\w$]*)(?!\s*=(?!=))/g,
    (full, pre, word) => {
      if(JS_KEYWORD_TYPOS[word]){ changed = true; return pre + JS_KEYWORD_TYPOS[word]; }
      return full;
    });
  return changed ? { text: out, note: 'Fixed keyword typo' } : null;
}
function tryFixJsSingleEquals(lineText){
  /* Assignment inside a condition can be intentional JavaScript.
     Do not silently change program behaviour. */
  return null;
}
function tryFixJsMissingSemicolon(lineText){
  const t = lineText.replace(/\s+$/, '');
  if(!t) return null;
  if(/[;{}:,]$/.test(t)) return null;
  if(/^\s*(\/\/|\/\*|\*)/.test(t)) return null;
  if(/[+\-*/%=&|<>!?:.,]$/.test(t)) return null;

  /* Only fix statement forms where adding ';' is unambiguous.
     Never touch control-flow headers or arbitrary expressions. */
  const safe =
    /^\s*(?:const|let|var)\s+[A-Za-z_$][\w$]*(?:\s*=\s*.+)?$/.test(t) ||
    /^\s*(?:return|throw)\b.+$/.test(t) ||
    /^\s*(?:break|continue)(?:\s+[A-Za-z_$][\w$]*)?$/.test(t) ||
    /^\s*[A-Za-z_$][\w$]*(?:\.[A-Za-z_$][\w$]*|\[[^\]]+\])*\s*=\s*.+$/.test(t) ||
    /^\s*[A-Za-z_$][\w$]*(?:\.[A-Za-z_$][\w$]*|\[[^\]]+\])*\s*\([^{};]*\)$/.test(t) ||
    /^\s*(?:\+\+|--).*|.*(?:\+\+|--)$/.test(t);

  return safe ? { text: t + ';', note: 'Added missing semicolon' } : null;
}
function tryFixJsUnmatchedClose(lineText, msg){
  const m = msg.match(/Unmatched\s+["']([\]\)\}])["']/);
  let ch = m ? m[1] : null;
  if(!ch){
    const stack = [];
    for(let i = 0; i < lineText.length; i++){
      const c = lineText[i];
      if(c === '{' || c === '(' || c === '[') stack.push(c);
      else if(c === '}' || c === ')' || c === ']'){
        const exp = c === '}' ? '{' : c === ')' ? '(' : '[';
        if(stack.length === 0 || stack[stack.length - 1] !== exp){ ch = c; break; }
        stack.pop();
      }
    }
  }
  if(!ch) return null;
  const idx = lineText.lastIndexOf(ch);
  if(idx < 0) return null;
  return { text: lineText.slice(0, idx) + lineText.slice(idx + 1), note: 'Removed unmatched "' + ch + '"' };
}
function tryFixJsUnclosedBracket(lineText, msg){
  const m = msg.match(/Unclosed\s+["']([\{\[\(])["']/);
  let ch = m ? m[1] : null;
  if(!ch){
    let opens = 0, closes = 0;
    for(const c of lineText){
      if(c === '{' || c === '(' || c === '[') opens++;
      else if(c === '}' || c === ')' || c === ']') closes++;
    }
    if(opens > closes){
      const stack = [];
      for(const c of lineText){
        if(c === '{' || c === '(' || c === '[') stack.push(c);
        else if(c === '}' || c === ')' || c === ']') stack.pop();
      }
      if(stack.length) ch = stack[stack.length - 1];
    }
  }
  if(!ch) return null;
  const c = ch === '{' ? '}' : ch === '[' ? ']' : ')';
  return { text: lineText + c, note: 'Added missing "' + c + '"' };
}
function tryFixJsAutoBalance(lineText, msg){
  const m = msg.match(/Expected\s+['"]([\]\)\}])['"]/);
  if(m) return { text: lineText + m[1], note: 'Added "' + m[1] + '"' };
  return tryFixJsUnclosedBracket(lineText, msg);
}

/* ---- Master fixer ---- */
function paneFileIdFor(cm){
  const fid = docFileId(cm);
  return fid || null;
}
function tryFixAnnotation(cm, annotation, file){
  if(!cm || !annotation) return false;
  const msg = String(annotation.message || '');
  const line = annotation.from.line;
  const lineText = cm.getLine(line) || '';
  if(!file){
    const fileId = paneFileIdFor(cm);
    file = fileId ? getFile(fileId) : null;
  }
  const fullText = cm.getValue();
  const kind = file ? kindOf(file.name) : '';

  let fix = null;

  if(kind === 'css' && !fix){
    if(/duplicat/i.test(msg)) fix = tryFixCssDuplicateProperty(lineText);
    if(!fix && /empty/i.test(msg)) fix = tryFixCssEmptyRule(lineText);
    if(!fix) fix = tryFixCssPropertyTypo(lineText);
    if(!fix) fix = tryFixCssZeroUnit(lineText);
    if(!fix) fix = tryFixCssMissingColon(lineText);
    if(!fix) fix = tryFixCssMissingSemicolon(lineText);
    if(!fix && /unclosed|unmatched|expected.*\}|missing.*\}/i.test(msg)) fix = tryFixCssUnclosedBrace(fullText);
    if(!fix) fix = tryFixCssUnclosedBrace(fullText);
  }

  if(kind === 'html' && !fix){
    if(/tag must be paired|start tag match failed|missing/i.test(msg)) fix = tryFixHtmlMissingTag(lineText, msg);
    if(!fix) fix = tryFixHtmlDuplicateId(lineText, msg);
    if(!fix) fix = tryFixHtmlDuplicateAttr(lineText, msg);
    if(!fix && /lowercase/i.test(msg)) fix = tryFixHtmlLowercase(lineText);
    if(!fix && /doctype/i.test(msg)) fix = tryFixHtmlDoctype(fullText);
    if(!fix) fix = tryFixHtmlMissingTag(lineText, msg);
  }

  if(kind === 'javascript' && !fix){
    if(/unterminated.*comment/i.test(msg)) fix = { text: fullText + ' */', wholeFile:true, note:'Closed block comment' };
    if(!fix) fix = tryFixJsUnmatchedClose(lineText, msg);
    if(!fix) fix = tryFixJsKeywordTypo(lineText, msg);
    if(!fix) fix = tryFixJsSingleEquals(lineText);
    if(!fix && /missing.*semicolon/i.test(msg)) fix = tryFixJsMissingSemicolon(lineText);
    if(!fix && /expected.*[\}\]\)]|unclosed|unmatched/i.test(msg)) fix = tryFixJsAutoBalance(lineText, msg);
    if(!fix && /trailing comma/i.test(msg)){
      const out = lineText.replace(/,(\s*[\}\]])/, '$1');
      if(out !== lineText) fix = { text: out, note: 'Removed trailing comma' };
    }
    if(!fix) fix = tryFixJsUnclosedBracket(lineText, msg);
  }

  if(kind === 'json' && !fix){
    const t1 = fullText.replace(/,(\s*[\}\]])/g, '$1');
    if(t1 !== fullText){ fix = { text: t1, wholeFile:true, note:'Removed trailing comma(s)' }; }
    if(!fix){
      const t2 = fullText.replace(/'([^'\\]*(?:\\.[^'\\]*)*)'(\s*:)/g, '"$1"$2')
                          .replace(/:\s*'([^'\\]*(?:\\.[^'\\]*)*)'/g, ': "$1"');
      if(t2 !== fullText) fix = { text: t2, wholeFile:true, note:'Fixed quotes' };
    }
    if(!fix){
      const t3 = fullText.replace(/([{,]\s*)([a-zA-Z_$][\w$]*)\s*:/g, '$1"$2":');
      if(t3 !== fullText) fix = { text: t3, wholeFile:true, note:'Quoted unquoted keys' };
    }
    if(!fix){
      let d = 0, b = 0, st = 'code', i = 0;
      while(i < fullText.length){
        const c = fullText[i], n = fullText[i+1];
        if(st === 'code'){
          if(c === '"' || c === "'"){ st = c === '"' ? 'dq' : 'sq'; i++; continue; }
          if(c === '{') d++; else if(c === '}') d = Math.max(0, d-1);
          if(c === '[') b++; else if(c === ']') b = Math.max(0, b-1);
        } else if(st === 'dq'){ if(c === '\\'){ i += 2; continue; } if(c === '"') st = 'code'; }
        else if(st === 'sq'){ if(c === '\\'){ i += 2; continue; } if(c === "'") st = 'code'; }
        i++;
      }
      if(d > 0 || b > 0){
        fix = { text: fullText + ']'.repeat(b) + '}'.repeat(d), wholeFile:true, note:'Closed '+d+' brace(s), '+b+' bracket(s)' };
      }
    }
  }

  if(!fix || (typeof fix.text !== 'string' && !fix.deleteLine)){
    addOutput('⚠ No fix for: "' + msg.slice(0, 160) + '"');
    return false;
  }

  if(fix.deleteLine){
    const lastLine = cm.lineCount() - 1;
    if(line >= lastLine){
      cm.replaceRange('', { line: line, ch: 0 }, { line: line, ch: lineText.length });
    } else {
      cm.replaceRange('', { line: line, ch: 0 }, { line: line + 1, ch: 0 });
    }
  } else if(fix.wholeFile){
    const cur = cm.getCursor();
    cm.setValue(fix.text);
    try { cm.setCursor(cur); } catch(e){}
  } else {
    cm.replaceRange(fix.text, { line: line, ch: 0 }, { line: line, ch: lineText.length });
  }

  toast('✨ ' + (fix.note || 'Fixed'), 'ok');
  return true;
}

function fixAllInEditor(cm, file){
  if(!cm) return 0;
  if(!file){
    const fid = paneFileIdFor(cm);
    file = fid ? getFile(fid) : null;
  }
  if(!file || kindOf(file.name) === 'text') return 0;

  let totalFixed = 0;
  for(let pass = 0; pass < 12; pass++){
    const text = cm.getValue();
    const anns = lintContent(file.name, text) || [];
    if(!anns.length) break;
    let fixedThisPass = 0;
    const sorted = anns.slice().sort((a, b) => b.from.line - a.from.line || b.from.ch - a.from.ch);
    for(const a of sorted){
      if(tryFixAnnotation(cm, a, file)){ fixedThisPass++; totalFixed++; }
    }
    if(!fixedThisPass) break;
  }
  return totalFixed;
}

/* Operates directly on each file's shared CodeMirror.Doc — no editor swapping,
   no flicker, and the file currently on screen updates live. */
function fixAllProblems(){
  if(!cmAvailable) return 0;
  let total = 0;
  state.files.forEach(f => {
    if(kindOf(f.name) === 'text') return;
    total += fixAllInEditor(f.doc, f);
  });
  lintAllFiles();
  updateDocTitle();
  scheduleAutosave();
  return total;
}

function onLintGutterClick(cm, line, gutter, event){
  if(gutter !== 'CodeMirror-lint-markers') return;
  const fileId = paneFileIdFor(cm);
  if(!fileId) return;
  const anns = lintResults.get(fileId) || [];
  const lineAnns = anns.filter(a => a.from.line === line);
  if(!lineAnns.length) return;
  event.preventDefault(); event.stopPropagation();

  let fixed = 0;
  lineAnns.slice().reverse().forEach(a => { if(tryFixAnnotation(cm, a)) fixed++; });
  if(fixed > 0){
    setTimeout(() => { if(cm.performLint) cm.performLint(); rebuildProblems(); }, 30);
  } else {
    toast('No auto-fix available: ' + lineAnns[0].message, 'warn');
  }
}

function initEditor(){

function setupImageDrop(ed){
  if(!ed) return;
  const w=ed.getWrapperElement();
  w.addEventListener('drop', async function(e){
    const dt=e.dataTransfer;
    if(!dt||!dt.files||!dt.files.length) return;
    const imgs=Array.from(dt.files).filter(f=>/^image\//i.test(f.type));
    if(!imgs.length) return;
    e.preventDefault(); e.stopPropagation();
    let coords=null;
    try { coords=ed.coordsChar({left:e.clientX, top:e.clientY}); } catch(err){ coords=null; }
    for(const img of imgs){
      try {
        const url=await readAsDataURL(img);
        const tag='<img src="'+url+'" alt="'+escapeHtml(img.name)+'">';
        if(coords){ ed.replaceRange(tag, coords); coords=null; }
        else ed.replaceSelection(tag);
        toast('Inserted '+img.name+' ('+humanBytes(img.size)+')','ok');
      } catch(err){ toast('Could not read '+img.name,'err'); }
    }
  }, true);
}

function activeFile(){ const id=getPaneActiveId(focusedPane); return id?getFile(id):null; }

function getFileByName(n){ return state.files.find(f=>f.name===n)||null; }
function createFileObject(name,content){
  name=sanitizeProjectPath(name)||'untitled.txt';
  const f={ id:uid(), name:name, savedContent:content||'', dirty:false, doc:null };
  if(cmAvailable){
    f.doc=CodeMirror.Doc(content||'', cmMode(name)||'text/plain');
    f.doc.__fileId = f.id;
  } else {
    f.doc = { __fileId:f.id, getValue:()=>f._plain||'', setValue:(v)=>{ f._plain=v; }, _stub:true };
    f._plain = content||'';
  }

}
function addFile(name, content, opts){
  opts=opts||{};
  name=sanitizeProjectPath(name)||'untitled.txt';
  let finalName=name, n=1;
  while(getFileByName(finalName)){
    const dot=name.lastIndexOf('.');
    finalName = dot>0 ? name.slice(0,dot)+'-'+(++n)+name.slice(dot) : name+'-'+(++n);
  }
  const file=createFileObject(finalName, content||'');
  state.files.push(file);
  if(!opts.silent){ renderTree(); if(opts.open!==false) openFile(file.id, opts.pane); }
  return file;
}
function removeFile(id){
  const idx=state.files.findIndex(f=>f.id===id); if(idx<0) return;
  state.files.splice(idx,1);
  lintResults.delete(id);
  [0,1].forEach(pi=>{
    const arr=getPaneTabs(pi); const ti=arr.indexOf(id);
    if(ti>=0) arr.splice(ti,1);
    if(getPaneActiveId(pi)===id){
      const nx=arr[Math.min(ti,arr.length-1)];
      if(nx){ setPaneActiveId(pi,nx); showFileInPane(pi, getFile(nx)); }
      else { setPaneActiveId(pi,null); clearPaneEditor(pi); }
    }
  });
  pruneEmptyFolders();
  renderTree(); renderAllTabs(); updatePaneEmptyHints(); updateDocTitle();
}
function renameFile(id, newName){
  const f=getFile(id); if(!f) return false;
  if(getFileByName(newName)){ toast('A file with that name already exists','warn'); return false; }
  f.name=newName;
  [0,1].forEach(pi=>{ const ed=getPaneEditor(pi); if(ed&&getPaneActiveId(pi)===id) ed.setOption('mode', cmMode(newName)||'text/plain'); });
  pruneEmptyFolders();
  renderTree(); renderAllTabs(); updateStatusBar();
  lintAllFiles();
  return true;
}
/* Drop folder entries that no longer contain any file. */
function pruneEmptyFolders(){
  let changed = true;
  while(changed){
    changed = false;
    state.folders = state.folders.filter(p=>{
      const hasChildFolder = state.folders.some(o=>o!==p && o.indexOf(p+'/')===0);
      const hasFile = state.files.some(f=>f.name.indexOf(p+'/')===0);
      if(!hasChildFolder && !hasFile){ changed = true; return false; }
      return true;
    });
  }
}

}
function loadProjectData(data){
  state.files=[]; state.folders=[]; state.openTabs=[]; state.activeId=null;
  state.pane2Tabs=[]; state.pane2ActiveId=null; state.fileHandle=null;
  state.collapsedFolders={}; lintResults.clear();
  if(data && data.collapsedFolders && typeof data.collapsedFolders === 'object'){
    Object.keys(data.collapsedFolders).forEach(k => {
      if(data.collapsedFolders[k]) state.collapsedFolders[k] = true;
    });
  }
  const incoming=[];
  if(data && Array.isArray(data.files) && data.files.length){
    data.files.forEach(f=>{
      const safeName=sanitizeProjectPath(f&&f.name);
      if(safeName) incoming.push({ name:safeName, content:typeof f.content==='string'?f.content:'' });
    });
    if(Array.isArray(data.folders)){
      state.folders=data.folders.filter(p=>typeof p==='string').map(sanitizeProjectPath).filter(Boolean);
    }
  } else if(data && (data.html!==undefined||data.css!==undefined||data.js!==undefined)){
    if(data.html!==undefined) incoming.push({ name:'index.html', content:String(data.html) });
    if(data.css!==undefined) incoming.push({ name:'style.css', content:String(data.css) });
    if(data.js!==undefined) incoming.push({ name:'script.js', content:String(data.js) });
  }
  state.projectName = (data&&data.projectName)?String(data.projectName):'My Project';
  if(!incoming.length) SAMPLE_PROJECT.files.forEach(f=>incoming.push({ name:f.name, content:f.content }));
  incoming.forEach(f=>{
    const file=createFileObject(f.name, f.content);
    file.savedContent=f.content; file.dirty=false;
    state.files.push(file);
  });
  pruneEmptyFolders();

  const tabsByName = Array.isArray(data&&data.openTabs)?data.openTabs:null;
  if(tabsByName) tabsByName.forEach(n=>{ const f=getFileByName(n); if(f) state.openTabs.push(f.id); });
  if(!state.openTabs.length){ const main=getFileByName('index.html')||state.files[0]; if(main) state.openTabs.push(main.id); }
  const activeName=data&&data.activeFile;
  const active=(activeName&&getFileByName(activeName))||getFile(state.openTabs[0])||state.files[0];
  if(active) state.activeId=active.id;

    if(Array.isArray(data.pane2Tabs)) data.pane2Tabs.forEach(n=>{ const f=getFileByName(n); if(f&&f.id!==state.activeId) state.pane2Tabs.push(f.id); });
    const p2Name=data&&data.pane2ActiveFile;
    const p2Active=(p2Name&&getFileByName(p2Name))||getFile(state.pane2Tabs[0]);
    if(p2Active&&p2Active.id!==state.activeId) state.pane2ActiveId=p2Active.id;
    else state.pane2ActiveId=state.pane2Tabs[0]||null;
  }
  renderTree();
  if(editor) showFileInPane(0, getFile(state.activeId));
  if(editor2) showFileInPane(1, getFile(state.pane2ActiveId));

/* ================================================================
   10. FILE TREE
   ================================================================ */
function buildTree(files, folders){
  const root={ type:'folder', name:'', path:'', children:[] };
  const map=new Map([['',root]]);
  function getFolder(path){
    if(map.has(path)) return map.get(path);
    const i=path.lastIndexOf('/');
    const pp=i===-1?'':path.slice(0,i);
    const name=i===-1?path:path.slice(i+1);
    const parent=getFolder(pp);
    const node={ type:'folder', name:name, path:path, children:[] };
    parent.children.push(node); map.set(path,node); return node;
  }
  folders.forEach(p=>{ if(p) getFolder(p); });
  files.forEach(f=>{
    const i=f.name.lastIndexOf('/');
    const pp=i===-1?'':f.name.slice(0,i);
    const name=i===-1?f.name:f.name.slice(i+1);
    getFolder(pp).children.push({ type:'file', name:name, path:f.name, file:f });
  });
  (function sortNode(n){
    n.children.sort((a,b)=>{ if(a.type!==b.type) return a.type==='folder'?-1:1; return a.name.localeCompare(b.name,undefined,{numeric:true}); });
    n.children.forEach(c=>{ if(c.type==='folder') sortNode(c); });
  })(root);
  return root;
}
function renderTree(){
  const host=$('#file-tree'); if(!host) return;
  host.innerHTML='';
  const tree=buildTree(state.files, state.folders);
  const frag=document.createDocumentFragment();
  if(!tree.children.length){
    const e=document.createElement('div'); e.className='panel-empty'; e.textContent='No files yet. Click ＋ to create one.'; frag.appendChild(e);
  } else tree.children.forEach(n=>frag.appendChild(renderTreeNode(n)));
  host.appendChild(frag);
  host.setAttribute('role','tree');
}
function renderTreeNode(node){
  const wrap=document.createElement('div');
  wrap.setAttribute('role','none');
  if(node.type==='folder'){
    const collapsed=!!state.collapsedFolders[node.path];
    const row=document.createElement('div');
    row.className='tree-row folder'; row.tabIndex=0;
    row.setAttribute('role','treeitem');
    row.setAttribute('aria-expanded', String(!collapsed));
    row.setAttribute('aria-label', node.name + ' folder');
    row.dataset.folderPath = node.path;
    row.innerHTML='<span class="ticon">'+(collapsed?'▸':'▾')+'</span><span class="ticon">'+FOLDER_ICON+'</span><span class="tname">'+escapeHtml(node.name)+'</span>';
    row.title=node.path;
    row.addEventListener('click', e=>{ e.preventDefault(); e.stopPropagation(); state.collapsedFolders[node.path]=!collapsed; renderTree(); });
    row.addEventListener('keydown', e=>{
      if(e.key==='ArrowLeft' && !collapsed){ e.preventDefault(); state.collapsedFolders[node.path]=true; renderTree(); }
      else if(e.key==='ArrowRight' && collapsed){ e.preventDefault(); state.collapsedFolders[node.path]=false; renderTree(); }
      else if((e.key==='Enter'||e.key===' ') && collapsed===false){ e.preventDefault(); state.collapsedFolders[node.path]=true; renderTree(); }
    });
    row.addEventListener('contextmenu', e=>{
      e.preventDefault();
      showContextMenu(e.clientX, e.clientY, [
        { label:'New File Here…', action:()=>promptNewFile(node.path+'/') },
        { label:'Rename Folder…', action:()=>promptRenameFolder(node.path) },
        { sep:true },
        { label:'Delete Folder', danger:true, action:()=>deleteFolder(node.path) }
      ]);
    });
    wrap.appendChild(row);
    if(!collapsed){
      const kids=document.createElement('div'); kids.className='tree-children';
      kids.setAttribute('role','group');
      node.children.forEach(c=>kids.appendChild(renderTreeNode(c)));
      wrap.appendChild(kids);
    }
  } else {
    const f=node.file;
    const row=document.createElement('div');
    const isActive=(f.id===state.activeId||f.id===state.pane2ActiveId);
    row.className='tree-row'+(isActive?' active':'');
    row.dataset.fileId=f.id; row.tabIndex=0;
    row.setAttribute('role','treeitem');
    row.setAttribute('aria-selected', isActive?'true':'false');
    row.setAttribute('aria-label','Open '+f.name);
    row.title='Open '+f.name;
    row.innerHTML='<span class="ticon">'+(typeOf(f.name).icon)+'</span><span class="tname">'+escapeHtml(node.name)+'</span>';
    row.addEventListener('dblclick', ()=>{ if(state.splitMode) openFile(f.id, focusedPane===0?1:0); });
    row.addEventListener('contextmenu', e=>{
      e.preventDefault();
      showContextMenu(e.clientX, e.clientY, [
        { label:'Open in Current Pane', action:()=>openFile(f.id, focusedPane) },
        { label:'Open in Other Pane', action:()=>openFile(f.id, focusedPane===0?1:0) },
        { sep:true },
        { label:'Rename…', action:()=>promptRenameFile(f.id) },
        { label:'Duplicate', action:()=>{ addFile(f.name.replace(/(\.[^.]+)$/,'-copy$1'), f.doc.getValue()); toast('File duplicated','ok'); } },
        { sep:true },
        { label:'Copy Contents', action:()=>copyToClipboard(f.doc.getValue(),'File copied') },
        { label:'Download File', action:()=>downloadCurrentFile(f.id) },
        { sep:true },
        { label:'Delete', danger:true, action:()=>deleteFileWithConfirm(f.id) }
      ]);
    });
    wrap.appendChild(row);
  }
  return wrap;
}
/* Tree-level keyboard + click delegation (survives re-renders). */
function initTreeDelegation(){
  const host=$('#file-tree'); if(!host) return;
  host.addEventListener('click', function(e){
    const row=e.target.closest('.tree-row[data-file-id]');
    if(!row || !host.contains(row)) return;
    const id=row.dataset.fileId;
    if(!getFile(id)){ toast('File not found.','err'); return; }
    e.preventDefault();
    openFile(id, focusedPane);
  });
  host.addEventListener('keydown', function(e){
    const row = e.target.closest && e.target.closest('.tree-row');
    if(!row || !host.contains(row)) return;
    const rows = $$('.tree-row', host);
    const idx = rows.indexOf(row);
    if(e.key==='ArrowDown'){ e.preventDefault(); if(rows[idx+1]) rows[idx+1].focus(); return; }
    if(e.key==='ArrowUp'){ e.preventDefault(); if(rows[idx-1]) rows[idx-1].focus(); return; }
    if(e.key==='Home'){ e.preventDefault(); if(rows[0]) rows[0].focus(); return; }
    if(e.key==='End'){ e.preventDefault(); if(rows[rows.length-1]) rows[rows.length-1].focus(); return; }
    if(e.key==='Enter' || e.key===' '){
      if(row.dataset.fileId){
        e.preventDefault();
        const id=row.dataset.fileId;
        if(getFile(id)) openFile(id, focusedPane);
      }
    }
  });
}
function promptNewFile(prefix, paneIdx){
  showPrompt('New File', (prefix||'')+'new-file.js', 'e.g. app.js or js/app.js').then(name=>{
    if(!name) return;
    if(getFileByName(name)){ toast('That file already exists','warn'); return; }
    const dir=dirName(name); if(dir) ensureFolders(dir);
    addFile(name, defaultContentFor(name), { pane:paneIdx });
    toast('Created '+name,'ok'); scheduleAutosave();
  });
}
function promptNewFolder(){
  showPrompt('New Folder', 'assets', 'Folder path, e.g. assets/img').then(name=>{
    if(!name) return;
    const clean=name.replace(/\/+$/,'');
    ensureFolders(clean); renderTree(); toast('Folder created','ok'); scheduleAutosave();
  });
}
function ensureFolders(path){
  const parts=path.split('/').filter(Boolean);
  let acc='';
  parts.forEach(p=>{ acc=acc?acc+'/'+p:p; if(!state.folders.includes(acc)) state.folders.push(acc); });
}
function promptRenameFile(id){
  const f=getFile(id); if(!f) return;
  showPrompt('Rename File', f.name, 'new name').then(name=>{
    if(!name||name===f.name) return;
    if(renameFile(id,name)){ toast('Renamed to '+name,'ok'); scheduleAutosave(); }
  });
}
function promptRenameFolder(path){
  showPrompt('Rename Folder', path, 'new folder path').then(n=>{
    if(!n||n===path) return;
    const clean=n.replace(/\/+$/,'');
    const oldPfx=path+'/';
    state.folders=state.folders.map(p=> p===path?clean:(p.indexOf(oldPfx)===0?clean+p.slice(path.length):p));
    state.files.forEach(f=>{ if(f.name.indexOf(oldPfx)===0) f.name=clean+f.name.slice(path.length); });
    renderTree(); renderAllTabs(); toast('Folder renamed','ok'); scheduleAutosave();
  });
}
function deleteFolder(path){
  const affected=state.files.filter(f=>f.name.indexOf(path+'/')===0);
  showConfirm('Delete Folder','Delete "'+path+'"'+(affected.length?' and its '+affected.length+' file(s)?':'?')+' This cannot be undone.','Delete',true).then(ok=>{
    if(!ok) return;
    affected.slice().forEach(f=>removeFile(f.id));
    state.folders=state.folders.filter(p=>p!==path && p.indexOf(path+'/')!==0);
    renderTree(); toast('Folder deleted','ok'); scheduleAutosave();
  });
}
function deleteFileWithConfirm(id){
  const f=getFile(id); if(!f) return;
  showConfirm('Delete File','Delete "'+f.name+'"? This cannot be undone.','Delete',true).then(ok=>{
    if(!ok) return;
    removeFile(id); toast('Deleted '+f.name,'ok'); scheduleAutosave();
  });
}
function defaultContentFor(name){
  const k=kindOf(name);
  const base = typeOf(name).defaultContent;
  if(k==='css') return '/* '+baseName(name)+' */\n\n';
  if(k==='javascript') return '// '+baseName(name)+'\n\n';
  return base;
}
let ctxEl=null;
function showContextMenu(x, y, items){
  hideContextMenu();
  const menu=document.createElement('div'); menu.id='context-menu'; menu.setAttribute('role','menu');
  items.forEach(it=>{
    if(it.sep){ const s=document.createElement('div'); s.className='ctx-sep'; menu.appendChild(s); return; }
    const row=document.createElement('div');
    row.className='ctx-item'+(it.danger?' danger':'');
    row.setAttribute('role','menuitem');
    row.tabIndex=0;
    row.textContent=it.label;
    row.addEventListener('click',()=>{ hideContextMenu(); it.action(); });
    row.addEventListener('keydown', e=>{ if(e.key==='Enter'){ hideContextMenu(); it.action(); } });
    menu.appendChild(row);
  });
  document.body.appendChild(menu); ctxEl=menu;
  const r=menu.getBoundingClientRect();
  menu.style.left=Math.min(x, window.innerWidth-r.width-8)+'px';
  menu.style.top=Math.min(y, window.innerHeight-r.height-8)+'px';
  const first=menu.querySelector('.ctx-item'); if(first) first.focus();
  setTimeout(()=>{ document.addEventListener('mousedown',onDocDown,true); document.addEventListener('keydown',onCtxKey,true); }, 0);
}
function hideContextMenu(){
  if(ctxEl){ ctxEl.remove(); ctxEl=null; }
  document.removeEventListener('mousedown',onDocDown,true);
  document.removeEventListener('keydown',onCtxKey,true);
}
function onDocDown(e){ if(ctxEl&&!ctxEl.contains(e.target)) hideContextMenu(); }
function onCtxKey(e){ if(e.key==='Escape') hideContextMenu(); }

function renderAllTabs(){ renderPaneTabs(0); renderPaneTabs(1); }
function renderPaneTabs(pi){
  const host=getPaneTabsEl(pi); if(!host) return;
  host.innerHTML='';
  const tabs=getPaneTabs(pi), activeId=getPaneActiveId(pi);
  tabs.forEach(id=>{
    const f=getFile(id); if(!f) return;
    const tab=document.createElement('button');
    tab.className='tab'+(id===activeId?' active':'')+(f.dirty?' dirty':'');
    tab.setAttribute('role','tab');
    tab.setAttribute('aria-selected', id===activeId?'true':'false');
    tab.tabIndex = id===activeId ? 0 : -1;
    tab.title=f.name;
    tab.innerHTML='<span class="ticon">'+(typeOf(f.name).icon)+'</span><span class="tab-name">'+escapeHtml(baseName(f.name))+'</span><span class="dot" aria-hidden="true"></span><span class="tab-close" role="button" title="Close tab" aria-label="Close tab">✕</span>';
    tab.addEventListener('mousedown', e=>{ if(e.button===1){ e.preventDefault(); closeTabInPane(id,pi); } });
    tab.addEventListener('click', e=>{ if(e.target.classList.contains('tab-close')) return; openFileInPane(id,pi); });
    tab.addEventListener('keydown', e=>{
      const arr = getPaneTabs(pi);
      const i = arr.indexOf(id);
      if(e.key==='ArrowRight'){ e.preventDefault(); const n=arr[(i+1)%arr.length]; openFileInPane(n,pi); const el=getPaneTabsEl(pi).children[(i+1)%arr.length]; if(el) el.focus(); }
      else if(e.key==='ArrowLeft'){ e.preventDefault(); const n=arr[(i-1+arr.length)%arr.length]; openFileInPane(n,pi); const el=getPaneTabsEl(pi).children[(i-1+arr.length)%arr.length]; if(el) el.focus(); }
      else if(e.key==='Delete'){ e.preventDefault(); closeTabInPane(id,pi); }
    });
    tab.querySelector('.tab-close').addEventListener('click', e=>{ e.stopPropagation(); closeTabInPane(id,pi); });
    host.appendChild(tab);
  });
  const add=document.createElement('button');
  add.className='tab-add'; add.title='New file'; add.setAttribute('aria-label','New file'); add.textContent='+';
  add.addEventListener('click',()=>promptNewFile('', pi));
  host.appendChild(add);
}
function openFileInPane(id, pi){
  pi=(pi===1)?1:0;
  const f=getFile(id), ed=getPaneEditor(pi);
  if(!f){ toast('File not found.','err'); return; }
  if(!ed){ toast('Editor not ready.','err'); return; }
  const otherPi=pi===0?1:0;
  if(state.splitMode && getPaneActiveId(otherPi)===id){ toast('Already open in the other pane','warn'); return; }
  const tabs=getPaneTabs(pi);
  if(tabs.indexOf(id)===-1) tabs.push(id);
  setPaneActiveId(pi,id);
  showFileInPane(pi,f);
  setFocusedPane(pi);
  renderPaneTabs(0); renderPaneTabs(1); renderTree(); updateStatusBar(); updateDocTitle();
  if(ed) ed.focus();
  scheduleAutosave();
}
function showFileInPane(pi, f){
  const ed=getPaneEditor(pi); if(!ed) return;
  if(!f){
    if(cmAvailable){ ed.swapDoc(CodeMirror.Doc('','text/plain')); ed.setOption('mode','text/plain'); }
    updatePaneEmptyHints();
    return;
  }
  if(cmAvailable){
    ed.swapDoc(f.doc);
    ed.setOption('mode', cmMode(f.name)||'text/plain');
    ed.setSize('100%','100%');
    applyEditorFonts();
    setTimeout(()=>{ if(ed.performLint) ed.performLint(); }, 30);
  }
  updatePaneEmptyHints();
}
function openFile(id, pi){ openFileInPane(id, typeof pi==='number'?pi:focusedPane); }
function closeTabInPane(id, pi){
  const arr=getPaneTabs(pi), idx=arr.indexOf(id);
  if(idx===-1) return;
  arr.splice(idx,1);
  if(getPaneActiveId(pi)===id){
    const nx=arr[Math.min(idx,arr.length-1)];
    if(nx){ setPaneActiveId(pi,nx); showFileInPane(pi, getFile(nx)); }
    else { setPaneActiveId(pi,null); clearPaneEditor(pi); }
  }
  renderPaneTabs(0); renderPaneTabs(1); renderTree(); updateStatusBar(); updatePaneEmptyHints(); updateDocTitle(); scheduleAutosave();
}
function closeActiveTab(){
  const id=getPaneActiveId(focusedPane);
  if(id) closeTabInPane(id, focusedPane);
}
function cycleTab(dir){
  const arr=getPaneTabs(focusedPane);
  if(arr.length<2) return;
  const cur=getPaneActiveId(focusedPane);
  const i=arr.indexOf(cur);
  const next=arr[(i+dir+arr.length)%arr.length];
  openFileInPane(next, focusedPane);
}
function updatePaneEmptyHints(){
  [0,1].forEach(pi=>{
    const h=getPaneHostEl(pi); if(!h) return;
    h.classList.toggle('empty', !getPaneActiveId(pi));
  });
}

function applySplitMode(){
  document.body.classList.toggle('split-mode', !!state.splitMode);
  const b=$('#btn-split'); if(b) b.classList.toggle('toggled', !!state.splitMode);
  const p0=getPaneEl(0), p1=getPaneEl(1);
  if(state.splitMode){ const r=clamp(state.splitRatio,0.15,0.85); p0.style.flex=String(r); p1.style.flex=String(1-r); }
  else { p0.style.flex=''; p1.style.flex=''; }
  setTimeout(()=>{ if(editor) editor.refresh(); if(editor2) editor2.refresh(); }, 30);
}
function toggleSplitMode(force){
  const on=typeof force==='boolean'?force:!state.splitMode;
  if(on===state.splitMode){ applySplitMode(); return; }
  if(on && !cmAvailable){ toast('Split view unavailable','warn'); return; }
  state.splitMode=on;
  if(on){
    if(!editor2){ state.splitMode=false; toast('Split view unavailable','warn'); return; }
    if(!state.pane2Tabs.length){
      const pid=state.activeId, pf=pid?getFile(pid):null;
      let sug=null;
      if(pf){
        const k=kindOf(pf.name);
        if(k==='html') sug=state.files.find(f=>kindOf(f.name)==='css'&&f.id!==pid);
        else if(k==='css') sug=state.files.find(f=>kindOf(f.name)==='html'&&f.id!==pid);
      }
      if(!sug) sug=state.files.find(f=>f.id!==pid)||null;
      if(sug){ state.pane2Tabs.push(sug.id); state.pane2ActiveId=sug.id; showFileInPane(1,sug); }
      else { state.pane2ActiveId=null; showFileInPane(1,null); }
      renderPaneTabs(1);
    }
    if(state.pane2ActiveId) showFileInPane(1, getFile(state.pane2ActiveId));
    toast('Split view enabled','ok');
    addOutput('⫲ Split view enabled');
  } else { toast('Split view disabled','ok'); addOutput('⫲ Split view disabled'); }
  applySplitMode(); renderAllTabs(); updatePaneEmptyHints(); persistAll();
}
function toggleZenMode(force){
  const on=typeof force==='boolean'?force:!state.zenMode;
  if(on===state.zenMode) return;
  state.zenMode=on;
  document.body.classList.toggle('zen-mode', on);
  const b=$('#btn-zen'); if(b) b.classList.toggle('toggled', on);
  setTimeout(()=>{ if(editor) editor.refresh(); if(editor2) editor2.refresh(); }, 30);
  if(on){ addOutput('🧘 Zen mode on — press Alt+Z to exit'); toast('Zen mode — press Alt+Z to exit','ok'); }
  else addOutput('🧘 Zen mode off');
}

    '  console.count = function(l){ var k=l||"default"; counts[k]=(counts[k]||0)+1; send("info", [k+": "+counts[k]], null); };',
    '  console.clear = function(){ send("system", ["\\u2713 Console cleared"], null); };',
    '  window.addEventListener("error", function(e){',
    '    var msg = e.message || "Script error";',
    '    send("error", [msg + (e.lineno ? "  (line " + e.lineno + ")" : "")], { file:e.filename||"", line:e.lineno||0, col:e.colno||0 });',
    '  });',
    '  window.addEventListener("unhandledrejection", function(e){',
    '    var r = e.reason;',
    '    send("error", ["Unhandled promise rejection: " + (r && r.message ? r.message : String(r))], null);',
    '  });',
    '})();'
  ];
  return '<scr'+'ipt>' + lines.join('\n') + '<\/scr'+'ipt>';
})();

let assetUrls = [];
function revokeAssetUrls(){
  assetUrls.forEach(u => { try{ URL.revokeObjectURL(u); }catch(e){} });
  assetUrls = [];
}
function buildAssetMap(){
  const map = {};
  state.files.forEach(f => {
    const k = kindOf(f.name);
    if(k === 'text' && extOf(f.name) !== 'svg') return;
    const url = URL.createObjectURL(new Blob([f.doc.getValue()], { type: mimeFor(f.name) }));
    assetUrls.push(url);
    map[f.name] = url;
  });
  return map;
}
function rewriteRefs(text, map){
  if(!map || !Object.keys(map).length) return text;
  const lookup = (val) => {
    const key = val.replace(/^\.\//,'').replace(/^\//,'');
    return map[key] || map[baseName(key)] || null;
  };
  text = text.replace(/url\(\s*(['"]?)([^'")]+)\1\s*\)/g, (m, q, u) => {
    if(isExternalUrl(u)) return m;
    const hit = lookup(u);
    return hit ? 'url(' + q + hit + q + ')' : m;
  });
  text = text.replace(/\b(src|href|poster|data-src|srcset)\s*=\s*(["'])([^"']*)\2/gi, (m, attr, q, val) => {
    if(isExternalUrl(val) || val.charAt(0)==='#') return m;
    const hit = lookup(val);
    return hit ? attr + '=' + q + hit + q : m;
  });
  text = text.replace(/(['"])(\.?\/?[\w./-]+\.(?:json|txt|md|csv|svg|xml|html|css|js))\1/g, (m, q, val) => {
    const hit = lookup(val);
    return hit ? q + hit + q : m;
  });
  return text;
}
function buildProjectDocument(map, injectBridge){
  map = map || {};
  const files=state.files;
  const htmlFile=getFileByName('index.html')||files.find(f=>kindOf(f.name)==='html')||null;
  const cssFiles=files.filter(f=>kindOf(f.name)==='css');
  const jsFiles=files.filter(f=>kindOf(f.name)==='javascript');
  let html = htmlFile ? htmlFile.doc.getValue() :
    '<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="UTF-8">\n<title>Preview</title>\n</head>\n<body>\n</body>\n</html>';

  /* Drop local <link> and <script src> — those files are inlined below. */
  html=html.replace(/<link\b[^>]*>/gi, function(tag){
    const hm=tag.match(/\bhref\s*=\s*["']([^"']*)["']/i); if(!hm) return tag;
    const rm=tag.match(/\brel\s*=\s*["']([^"']*)["']/i);
    if(rm && !/stylesheet/i.test(rm[1])) return tag;
    return isExternalUrl(hm[1])?tag:'';
  });
  html=html.replace(/<script\b[^>]*\bsrc\s*=\s*["']([^"']*)["'][^>]*>\s*<\s*\/\s*script\s*>/gi, function(t,s){ return isExternalUrl(s)?t:''; });

  /* Any remaining reference to a project file becomes a blob URL. */
  html = rewriteRefs(html, map);

  let cssBlock='';
  if(cssFiles.length){
    cssBlock='<style>\n'+cssFiles.map(f=>'/* ==== '+f.name+' ==== */\n'+rewriteRefs(f.doc.getValue(), map).replace(/<\/style/gi, '<\\/style')).join('\n\n')+'\n</style>';
  }
  let jsBlock='';
  if(jsFiles.length) jsBlock=jsFiles.map(f=>{
    const src = rewriteRefs(f.doc.getValue().replace(/<\/(script)/gi,'<\\/$1'), map);
    return '<script>\n'+src+'\n//# sourceURL='+f.name+'\n<\/script>';
  }).join('\n');

  if(injectBridge){
    if(/<head[^>]*>/i.test(html)) html=html.replace(/<head[^>]*>/i, m=>m+'\n'+CONSOLE_BRIDGE);
    else if(/<html[^>]*>/i.test(html)) html=html.replace(/<html[^>]*>/i, m=>m+'\n<head>'+CONSOLE_BRIDGE+'</head>');
    else html=CONSOLE_BRIDGE+'\n'+html;
  }
  if(cssBlock){
    if(/<\/head>/i.test(html)) html=html.replace(/<\/head>/i, cssBlock+'\n</head>');
    else if(/<body[^>]*>/i.test(html)) html=html.replace(/<body[^>]*>/i, m=>cssBlock+'\n'+m);
    else html=cssBlock+'\n'+html;
  }
  if(jsBlock){
    if(/<\/body>/i.test(html)) html=html.replace(/<\/body>/i, jsBlock+'\n</body>');
    else html=html+'\n'+jsBlock;
  }
  return html;
}
function buildPreviewDocument(map){ return buildProjectDocument(map || {}, true); }

window.addEventListener('message', function(e){
  if(e.source!==previewFrame.contentWindow) return;
  const d=e.data; if(!d||d.__nibir!==true) return;
  addConsoleEntry(d.level, d.text, d.meta);
  if(d.level==='error'){
    let file='', line=0, col=0;
    if(d.meta&&d.meta.file){ file=String(d.meta.file).replace(/^.*\//,''); line=d.meta.line||0; col=d.meta.col||0; }
    addProblem({ file, line, col, message:d.text });

/* Runtime errors become editor gutter markers on the matching file. */
function addRuntimeAnnotation(fileName, line, col, message){
  if(!fileName || !cmAvailable) return;
  const target = baseName(fileName);
  const f = state.files.find(x=>x.name===fileName) || state.files.find(x=>baseName(x.name)===target);
  if(!f) return;
  const arr = lintResults.get(f.id) || [];
  arr.push({
    from: CodeMirror.Pos(Math.max(0,(line||1)-1), Math.max(0,(col||1)-1)),
    to:   CodeMirror.Pos(Math.max(0,(line||1)-1), Math.max(1,(col||1))),
    message: message, severity:'error', runtime:true
  });
  lintResults.set(f.id, arr);
  [editor, editor2].forEach(ed => {
    if(ed && docFileId(ed) === f.id && ed.performLint) ed.performLint();
  });
  rebuildProblems();
}

let consoleQueue = [];
let consoleFlushScheduled = false;

function clearConsole(){
  consoleLog=[];
  consoleQueue=[];
  const p=$('#console-panel'); if(p) p.innerHTML='';
}
function buildConsoleLine(entry){
  const line=document.createElement('div');
  const marker={log:'›',info:'ℹ',debug:'🐞',warn:'⚠',error:'✖',system:'✓'}[entry.level]||'›';
  line.className='console-line '+(entry.level||'log');
  line.innerHTML='<span class="marker">'+marker+'</span><span class="ctext"></span>';
  line.querySelector('.ctext').textContent=entry.text;
  if(entry.meta && entry.meta.file){
    line.classList.add('clickable');
    line.title='Click to jump to '+entry.meta.file+(entry.meta.line?':'+entry.meta.line:'');
    line.addEventListener('click',()=>gotoLocation(entry.meta.file, entry.meta.line, entry.meta.col));
  }
  return line;
}
function flushConsoleQueue(){
  consoleFlushScheduled = false;
  if(!consoleQueue.length) return;
  const panel=$('#console-panel');
  if(!panel){ consoleQueue=[]; return; }
  const frag=document.createDocumentFragment();
  consoleQueue.forEach(entry => frag.appendChild(buildConsoleLine(entry)));
  consoleQueue = [];
  panel.appendChild(frag);
  while(panel.children.length>MAX_CONSOLE_LINES) panel.removeChild(panel.firstChild);
  if(panel.classList.contains('active')) panel.scrollTop=panel.scrollHeight;
}
function addConsoleEntry(level, text, meta){
  const entry = { level, text, meta:meta||null, time:Date.now() };
  consoleLog.push(entry);
  if(consoleLog.length>MAX_CONSOLE_LINES) consoleLog.splice(0, consoleLog.length-MAX_CONSOLE_LINES);
  consoleQueue.push(entry);
  if(!consoleFlushScheduled){
    consoleFlushScheduled = true;
    if(typeof requestAnimationFrame === 'function') requestAnimationFrame(flushConsoleQueue);
    else setTimeout(flushConsoleQueue, 16);
  }
}
function copyConsole(){
  const txt=consoleLog.map(e=>'['+e.level+'] '+e.text).join('\n');
  copyToClipboard(txt||'(console is empty)','Console copied');
}
function addProblem(p){
  if(runtimeProblems.some(x=>x.message===p.message&&x.file===p.file&&x.line===p.line)) return;
  runtimeProblems.push(p);
  rebuildProblems();
}
let problemsRebuildScheduled = false;
function scheduleProblemsRebuild(){
  if(problemsRebuildScheduled) return;
  problemsRebuildScheduled = true;
  setTimeout(()=>{ problemsRebuildScheduled = false; rebuildProblems(); }, 40);
}
function rebuildProblems(){
  const combined=runtimeProblems.slice();
  lintResults.forEach((anns, fid)=>{
    const f=getFile(fid); if(!f) return;
    anns.forEach(a=>{
      combined.push({
        file:f.name, line:a.from.line+1, col:a.from.ch+1,
        message:a.message, severity:a.severity||'error', lint:true, fileId:fid
      });
    });
  });
  problems=combined;
  renderProblems();
}
function renderProblems(){
  const panel=$('#problems-panel'), badge=$('#problems-count');
  panel.innerHTML='';
  if(badge){
    if(problems.length){ badge.textContent=problems.length; badge.classList.remove('hidden'); }
    else badge.classList.add('hidden');
  }
  updateMsgCount();
  if(!problems.length){
    panel.innerHTML='<div class="panel-empty">No problems detected. 🎉</div>';
    return;
  }
  const frag=document.createDocumentFragment();
  problems.forEach(p=>{
    const item=document.createElement('div');
    item.className='problem-item';
    const icon=p.severity==='warning'?'⚠':'❌';
    item.innerHTML='<span class="pico">'+icon+'</span>'+
      '<span class="pmsg"></span>'+
      '<span class="ploc">'+escapeHtml((p.file||'preview')+(p.line?':'+p.line:''))+'</span>'+
      '<button class="pfix" data-fix="1">🔧 Fix</button>';
    item.querySelector('.pmsg').textContent=p.message;

    item.addEventListener('click', e=>{
      if(e.target.closest('.pfix')) return;
      if(p.file) gotoLocation(p.file, p.line, p.col);
      else toast('This problem came from the preview document.','warn');
    });

    const btn=item.querySelector('.pfix');
    btn.addEventListener('click', e=>{
      e.stopPropagation(); e.preventDefault();
      if(!p.fileId || !cmAvailable){ toast('Cannot auto-fix this problem','warn'); return; }
      const f=getFile(p.fileId); if(!f){ toast('File not found','err'); return; }
      const pi=focusedPane;
      if(getPaneActiveId(pi)!==f.id) openFileInPane(f.id, pi);
      const ed=getPaneEditor(pi); if(!ed) return;
      const ann={ from:CodeMirror.Pos(p.line-1, p.col-1), to:CodeMirror.Pos(p.line-1, p.col), message:p.message };
      const ok=tryFixAnnotation(ed, ann, f);
      if(ok){ setTimeout(()=>{ if(ed.performLint) ed.performLint(); rebuildProblems(); }, 30); }
      else toast('No auto-fix available for this problem','warn');
    });

    frag.appendChild(item);
  });
  panel.appendChild(frag);
}
function gotoLocation(fileName, line, col){
  const target=baseName(fileName);
  const f=state.files.find(x=>x.name===fileName)||state.files.find(x=>baseName(x.name)===target);
  if(!f){ toast('Could not find '+fileName+' in this project','warn'); return; }
  const otherPi=focusedPane===0?1:0;
  if(state.splitMode && getPaneActiveId(otherPi)===f.id) setFocusedPane(otherPi);
  else openFileInPane(f.id, focusedPane);
  const ed=getFocusedEditor(); if(!ed || !cmAvailable) return;
  const ll=Math.max(0, ed.lineCount()-1);
  const l=clamp((line||1)-1, 0, ll);
  const ch=Math.max(0, (col||1)-1);
  ed.setCursor({line:l, ch:ch});
  ed.scrollIntoView({line:l, ch:0}, 120);
  ed.focus();
  ed.addLineClass(l, 'background', 'CodeMirror-activeline-background');
  setTimeout(()=>ed.removeLineClass(l, 'background', 'CodeMirror-activeline-background'), 1200);
}
/* Incremental output log — mirrors the console's queueing approach. */

function serializeProject(){
  return {
    format:'nibir-ide', version:2,
    projectName:state.projectName, savedAt:new Date().toISOString(),
    folders:state.folders.slice(),
    collapsedFolders:Object.assign({}, state.collapsedFolders),
    files:state.files.map(f=>({ name:f.name, type:kindOf(f.name), content:f.doc.getValue() })),
    openTabs:state.openTabs.map(id=>(getFile(id)||{}).name).filter(Boolean),
    activeFile:(getFile(state.activeId)||{}).name||null,
    splitMode:!!state.splitMode, splitRatio:state.splitRatio,
    pane2Tabs:state.pane2Tabs.map(id=>(getFile(id)||{}).name).filter(Boolean),
    pane2ActiveFile:(getFile(state.pane2ActiveId)||{}).name||null,
    settings:{ theme:settings.theme, fontSize:settings.fontSize, tabSize:settings.tabSize, wordWrap:settings.wordWrap }
  };
}
function markProjectSaved(){
  state.files.forEach(f=>{ f.savedContent=f.doc.getValue(); f.dirty=false; });

async function saveProject(saveAs){
  if(settings.formatOnSave) formatAllFiles();
  if(settings.autoFixOnSave){
    const n=fixAllProblems();
    if(n>0) toast('🔧 Auto-fixed '+n+' problem(s) before save','ok');
  }
  const data=serializeProject();
  const json=JSON.stringify(data, null, 2);
  const blob=new Blob([json],{type:'application/json'});
  const suggested=sanitizeFileName(state.projectName)+'.nibir.json';
  if(window.showSaveFilePicker){
    try {
      if(!state.fileHandle || saveAs){
        state.fileHandle=await window.showSaveFilePicker({
          suggestedName:suggested,
          types:[{ description:'Nibir Project (JSON)', accept:{ 'application/json':['.json'] } }]
        });
      }
      const w=await state.fileHandle.createWritable();
      await w.write(blob); await w.close();
      markProjectSaved(); persistAll(); pushRecentProject();
      addOutput('💾 Saved project to disk'); toast('✓ Project saved','ok');
      flashButton($('#btn-save'),'✓ Saved');
      return true;
    } catch(err){
      if(err&&err.name==='AbortError') return false;
      state.fileHandle=null;
    }
  }
  downloadBlob(blob, suggested);
  markProjectSaved(); persistAll(); pushRecentProject();
  addOutput('💾 Saved project (download)'); toast('✓ Project saved','ok');
  flashButton($('#btn-save'),'✓ Saved');
  return true;
}
function openFilePicker(){
  const input=document.createElement('input');
  input.type='file'; input.accept='.json,.zip,application/json,application/zip'; input.multiple=false;
  input.onchange=e=>{ const f=e.target.files&&e.target.files[0]; if(f) importFile(f); };
  input.click();
}
async function importFile(file){
  const n=file.name.toLowerCase();
  if(n.endsWith('.zip')) return importZip(file);
  if(n.endsWith('.json')) return importJson(file);
  toast('Unsupported file type: '+file.name,'warn');
}
function importJson(file){
  return new Promise(resolve=>{
    const r=new FileReader();
    r.onload=ev=>{
      try {
        const data=JSON.parse(ev.target.result);
        const payload=(data&&data.project&&typeof data.project==='object')?data.project:data;
        loadProjectData(payload);
        if(!payload.projectName && /\.json$/i.test(file.name)){ state.projectName=file.name.replace(/\.json$/i,'')||'My Project'; renderProjectName(); updateDocTitle(); }
        afterProjectLoaded('Opened '+file.name);
        resolve(true);
      } catch(err){ console.error(err); toast('❌ Invalid JSON','err'); resolve(false); }
    };
    r.onerror=()=>{ toast('❌ Could not read the file','err'); resolve(false); };
    r.readAsText(file);
  });
}
async function importZip(file){
  if(typeof JSZip==='undefined' || window.__jszipFailed){ toast('JSZip unavailable','err'); return false; }
  try {
    const zip=await JSZip.loadAsync(file);
    const entries=[]; zip.forEach((p,e)=>{ if(!e.dir) entries.push({path:p, entry:e}); });
    const TEXT_EXT=['html','htm','css','js','mjs','json','txt','svg','xml','md'];
    let usable=entries.filter(e=>!/(^|\/)__MACOSX\//.test(e.path)&&!/(^|\/)\.DS_Store$/.test(e.path)&&TEXT_EXT.indexOf(extOf(e.path))!==-1);
    if(!usable.length){ toast('No readable files in ZIP','warn'); return false; }
    const first=usable[0].path, sl=first.indexOf('/');
    if(sl>0){ const pfx=first.slice(0, sl+1); if(usable.every(e=>e.path.indexOf(pfx)===0)) usable=usable.map(e=>Object.assign({}, e, {path:e.path.slice(pfx.length)})); }
    const files=[];
    for(const it of usable){ files.push({ name:it.path, content:await it.entry.async('string') }); }
    loadProjectData({ projectName:sanitizeFileName(file.name.replace(/\.zip$/i,''))||'Imported Project', files });
    afterProjectLoaded('Imported '+file.name);
    toast('✓ Imported '+files.length+' file(s)','ok');
    return true;
  } catch(err){ console.error(err); toast('❌ ZIP import failed: '+(err.message||err),'err'); return false; }
}
function afterProjectLoaded(msg){
  runtimeProblems=[];
  rebuildProblems();
  addOutput(msg||'Project loaded');
  persistAll(); pushRecentProject(); runProject(); hideWelcome();
}
function downloadCurrentFile(id){

  const blob=new Blob([f.doc.getValue()],{type:'text/plain;charset=utf-8'});
  downloadBlob(blob, baseName(f.name));
  toast('⬇ Downloaded '+baseName(f.name),'ok');
}
/* Every file is written under its own path — nothing is dropped. */
async function exportZip(){
  if(typeof JSZip==='undefined' || window.__jszipFailed){ toast('JSZip unavailable','err'); return; }
  const btn=$('#btn-zip'), orig=btn.textContent;
  btn.textContent='⏳ …';
  try {
    const zip=new JSZip();
    const rootName=sanitizeFileName(state.projectName);
    const root=zip.folder(rootName);
    state.files.forEach(f=>{ root.file(f.name, f.doc.getValue()); });
    if(!state.files.some(f=>f.name==='index.html')){
      const firstHtml=state.files.find(f=>kindOf(f.name)==='html');
      if(firstHtml) root.file('index.html', firstHtml.doc.getValue());
    }
    const blob=await zip.generateAsync({type:'blob'});
    const zn=rootName+'.zip';
    if(window.showSaveFilePicker){
      try {
        const h=await window.showSaveFilePicker({ suggestedName:zn, types:[{ description:'ZIP archive', accept:{ 'application/zip':['.zip'] } }] });
        const w=await h.createWritable(); await w.write(blob); await w.close();
        toast('✓ ZIP exported','ok'); addOutput('📦 Exported ZIP: '+zn);
        btn.textContent=orig; return;
      } catch(err){ if(err&&err.name==='AbortError'){ btn.textContent=orig; return; } }
    }
    downloadBlob(blob, zn);
    toast('✓ ZIP exported','ok'); addOutput('📦 Exported ZIP: '+zn);
  } catch(err){ console.error(err); toast('❌ ZIP export failed','err'); }
  finally { btn.textContent=orig; }
}
function copyToClipboard(text, ok){
  const done=()=>toast(ok||'✓ Copied!','ok');
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>{ legacyCopy(text); done(); });
  } else { legacyCopy(text); done(); }
}
function legacyCopy(text){
  const ta=document.createElement('textarea');
  ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch(e){}
  document.body.removeChild(ta);
}
