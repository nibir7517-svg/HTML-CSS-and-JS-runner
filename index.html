function loadSettings(){
  let stored=false;
  try {
    const r=localStorage.getItem(STORAGE_SETTINGS);
    if(r){
        const incoming=JSON.parse(r);
        settings=Object.assign({}, DEFAULT_SETTINGS, incoming && typeof incoming==='object' ? incoming : {});
        const themes=['dark','light','dracula','monokai','high-contrast'];
        if(themes.indexOf(settings.theme)===-1) settings.theme=DEFAULT_SETTINGS.theme;
        if(![12,13,14,15,16,18,20].includes(Number(settings.fontSize))) settings.fontSize=DEFAULT_SETTINGS.fontSize;
        if(![2,4,8].includes(Number(settings.tabSize))) settings.tabSize=DEFAULT_SETTINGS.tabSize;
        if(![250,500,1000].includes(Number(settings.runDelay))) settings.runDelay=DEFAULT_SETTINGS.runDelay;
        settings.fontSize=Number(settings.fontSize);
        settings.tabSize=Number(settings.tabSize);
        settings.runDelay=Number(settings.runDelay);
        settings.wordWrap=!!settings.wordWrap;
        settings.lineNumbers=!!settings.lineNumbers;
        settings.foldGutter=!!settings.foldGutter;
        settings.showWhitespace=!!settings.showWhitespace;
        settings.autoRun=!!settings.autoRun;
        settings.autoSave=!!settings.autoSave;
        settings.autoFixOnSave=!!settings.autoFixOnSave;
        settings.formatOnSave=!!settings.formatOnSave;
        stored=true;
      }
  } catch(e){}
  if(!stored && window.matchMedia){
    settings.theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  }
  try { const r=localStorage.getItem(STORAGE_LAYOUT); if(r) layout=Object.assign({}, DEFAULT_LAYOUT, JSON.parse(r)); } catch(e){}
  if(typeof layout.splitRatio==='number') state.splitRatio=clamp(layout.splitRatio, 0.15, 0.85);
}
function persistSettings(){ try { localStorage.setItem(STORAGE_SETTINGS, JSON.stringify(settings)); } catch(e){} }
function saveLayout(){ layout.splitRatio=state.splitRatio; try { localStorage.setItem(STORAGE_LAYOUT, JSON.stringify(layout)); } catch(e){} }
function applyTheme(){ document.body.dataset.theme=settings.theme; applyEditorSettings(); }

/* Generic list-overlay driver, reused by the palette and quick open. */
function openListOverlay(opts){
  const id = opts.id;
  if($('#'+id+'-overlay')) return;
  const ov=document.createElement('div');
  ov.id=id+'-overlay';
  ov.innerHTML='<div id="'+id+'" role="dialog" aria-modal="true">'+
    '<input type="text" id="'+id+'-input" placeholder="'+escapeHtml(opts.placeholder||'')+'" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="true" aria-autocomplete="list" aria-controls="'+id+'-list" aria-activedescendant="">'+
    '<div id="'+id+'-list" role="listbox" aria-label="'+escapeHtml(opts.listLabel||'Results')+'"></div></div>';
  document.body.appendChild(ov);

  const input=ov.querySelector('#'+id+'-input');
  const list=ov.querySelector('#'+id+'-list');
  let index=0, filtered=[], lastFocus=document.activeElement;

  function render(){
    const q=input.value.trim();
    filtered=opts.search(q);
    index=clamp(index, 0, Math.max(0, filtered.length-1));
    list.innerHTML='';
    if(!filtered.length){
      list.innerHTML='<div class="panel-empty">'+escapeHtml(opts.emptyMessage||'No matches')+'</div>';
      input.setAttribute('aria-activedescendant','');
      return;
    }
    const frag=document.createDocumentFragment();
    filtered.forEach((item,i)=>{
      const el=document.createElement('div');
      el.className='palette-item'+(i===index?' sel':'');
      el.id = id+'-opt-'+i;
      el.setAttribute('role','option');
      el.setAttribute('aria-selected', i===index?'true':'false');
      el.innerHTML=opts.renderItem(item);
      el.addEventListener('mouseenter', ()=>{ if(index===i) return; index=i; render(); });
      el.addEventListener('click', ()=>choose(item,false));
      frag.appendChild(el);
    });
    list.appendChild(frag);
    const sel=list.querySelector('.palette-item.sel');
    if(sel && sel.scrollIntoView) sel.scrollIntoView({block:'nearest'});
    input.setAttribute('aria-activedescendant', id+'-opt-'+index);
  }
  function close(){
    ov.remove();
    if(lastFocus && lastFocus.focus){ try{ lastFocus.focus(); }catch(e){} }
  }
  function choose(item, alt){
    close();
    try { opts.onChoose(item, alt); }
    catch(err){ console.error(err); toast('Command failed: '+(err.message||err),'err'); }
  }
  input.addEventListener('input', ()=>{ index=0; render(); });
  input.addEventListener('keydown', e=>{
    if(e.key==='ArrowDown'){ e.preventDefault(); index=Math.min(index+1, filtered.length-1); render(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); index=Math.max(index-1, 0); render(); }
    else if(e.key==='Enter'){ e.preventDefault(); if(filtered[index]) choose(filtered[index], e.ctrlKey||e.metaKey); }
    else if(e.key==='Escape'){ e.preventDefault(); close(); }
  });
  ov.addEventListener('mousedown', e=>{ if(e.target===ov) close(); });
  render();
  setTimeout(()=>input.focus(), 20);
}
function openCommandPalette(){
  openListOverlay({
    id:'palette',
    placeholder:'Type a command…',
    listLabel:'Commands',
    emptyMessage:'No matching commands',
    search:(q)=>{
      const needle=q.toLowerCase();
      return COMMANDS
        .map(c=>{
          const score = q ? Math.max(fuzzyScore(q, c.title), fuzzyScore(q, c.cat)) : 0;
          return { c, score, ok: !q || score>=0 || c.title.toLowerCase().indexOf(needle)!==-1 || c.cat.toLowerCase().indexOf(needle)!==-1 };
        })
        .filter(x=>x.ok)
        .sort((a,b)=>b.score-a.score)
        .map(x=>x.c);
    },
    renderItem:(c)=>'<span class="p-cat">'+escapeHtml(c.cat)+'</span><span>'+escapeHtml(c.title)+'</span>'+(c.hint?'<span class="p-hint">'+escapeHtml(c.hint)+'</span>':''),
    onChoose:(c)=>c.run()
  });
}
function openQuickOpen(){
  openListOverlay({
    id:'quickopen',
    placeholder:'Type a file name…  (Ctrl+Enter opens in the other pane)',
    listLabel:'Files',
    emptyMessage:'No matching files',
    search:(q)=>{
      return state.files
        .map(f=>{
          const score = q ? Math.max(fuzzyScore(q, f.name), fuzzyScore(q, baseName(f.name))) : 0;
          return { f, score };
        })
        .filter(x => !q || x.score>=0)
        .sort((a,b)=>b.score-a.score)
        .map(x=>x.f);
    },
    renderItem:(f)=>{
      const parts = f.name.split('/');
      const name = parts.pop();
      const dir = parts.length ? parts.join('/')+'/' : '';
      return '<span class="ticon">'+typeOf(f.name).icon+'</span><span>'+escapeHtml(name)+'</span>'+(dir?'<span class="p-path">'+escapeHtml(dir)+'</span>':'');
    },
    onChoose:(f, alt)=>openFileInPane(f.id, alt ? (focusedPane===0?1:0) : focusedPane)
  });
}
function toggleSetting(k){
  settings[k]=!settings[k];
  applyEditorSettings(); persistSettings();
  const labels={ wordWrap:'Word wrap', lineNumbers:'Line numbers', foldGutter:'Fold gutter', showWhitespace:'Whitespace markers' };
  toast((labels[k]||k)+' '+(settings[k]?'on':'off'),'ok');
}
function changeFontSize(d){
  settings.fontSize=clamp(settings.fontSize+d, 8, 40);
  applyEditorSettings(); persistSettings();
  toast('Font size: '+settings.fontSize+'px');
}
function cycleTheme(){
  const o=['dark','light','dracula','monokai','high-contrast'];
  const i=o.indexOf(settings.theme);
  settings.theme=o[(i+1)%o.length];
  applyTheme(); persistSettings();
  toast('Theme: '+settings.theme);
}
function swapPanes(){
  if(!state.splitMode) return;
  const t0=state.openTabs, a0=state.activeId;
  state.openTabs=state.pane2Tabs; state.activeId=state.pane2ActiveId;
  state.pane2Tabs=t0; state.pane2ActiveId=a0;
  showFileInPane(0, getFile(state.activeId));
  showFileInPane(1, getFile(state.pane2ActiveId));
  renderAllTabs(); updatePaneEmptyHints(); persistAll();
  toast('Panes swapped','ok');
}

function openProjectSearch(){
  openModal({
    title:'Search & Replace in Project',
    bodyHTML:
      '<div style="display:flex;flex-direction:column;gap:8px;">'+
        '<input type="search" id="ps-input" placeholder="Search text across all files…" autocomplete="off" aria-label="Search text">'+
        '<input type="text" id="ps-replace" placeholder="Replace with… (optional)" autocomplete="off" aria-label="Replacement text">'+
        '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">'+
          '<label style="display:flex;gap:6px;align-items:center;font-size:12px;color:var(--dim);"><input type="checkbox" id="ps-case"> Case sensitive</label>'+
          '<span style="flex:1;"></span>'+
          '<button id="ps-replace-all">Replace All in Project</button>'+
        '</div>'+
      '</div>'+
      '<div id="ps-results" style="margin-top:12px;max-height:46vh;overflow:auto;"></div>',
    buttons:[{ label:'Close', value:true }],
    onMount:function(body, close){
      const input=body.querySelector('#ps-input');
      const replaceIn=body.querySelector('#ps-replace');
      const caseChk=body.querySelector('#ps-case');
      const results=body.querySelector('#ps-results');
      const replaceAllBtn=body.querySelector('#ps-replace-all');
      const doSearch=debounce(function(){
        const q=input.value;
        results.innerHTML='';
        if(q.trim().length<2){ results.innerHTML='<div class="panel-empty">Type at least 2 characters.</div>'; return; }
        const cs=caseChk.checked;
        const needle=cs?q:q.toLowerCase();
        let total=0; const frag=document.createDocumentFragment();
        state.files.forEach(f=>{
          const lines=f.doc.getValue().split('\n');
          lines.forEach((line,i)=>{
            const hay=cs?line:line.toLowerCase();
            const idx=hay.indexOf(needle);
            if(idx===-1) return;
            total++; if(total>300) return;
            const row=document.createElement('div');
            row.className='search-result';
            const before=line.slice(0,idx), match=line.slice(idx, idx+q.length), after=line.slice(idx+q.length);
            row.innerHTML='<span class="sr-file"></span><span class="sr-line">'+(i+1)+'</span><span class="sr-text"><span class="sr-before"></span><mark></mark><span class="sr-after"></span></span>';
            row.querySelector('.sr-file').textContent=f.name;
            row.querySelector('.sr-before').textContent=before.trim().slice(-60);
            row.querySelector('mark').textContent=match;
            row.querySelector('.sr-after').textContent=after.trim().slice(0,80);
            row.addEventListener('click', ()=>{ close(true); gotoLocation(f.name, i+1, idx+1); });
            frag.appendChild(row);
          });
        });
        if(!total) results.innerHTML='<div class="panel-empty">No matches found.</div>';
        else { results.appendChild(frag); if(total>300){ const m=document.createElement('div'); m.className='panel-empty'; m.textContent='Showing first 300 matches.'; results.appendChild(m); } }
      }, 180);
      input.addEventListener('input', doSearch);
      caseChk.addEventListener('change', doSearch);
      replaceAllBtn.addEventListener('click', async ()=>{
        const find=input.value, replace=replaceIn.value;
        if(find.trim().length<1){ toast('Type something to find first','warn'); return; }
        const ok=await showConfirm('Replace All','Replace every occurrence of "'+find+'" across '+state.files.length+' file(s)?','Replace All',false);
        if(!ok) return;
        const cs=caseChk.checked;
        const re=new RegExp(escapeRegExp(find), cs?'g':'gi');
        let total=0;
        state.files.forEach(f=>{
          const c=f.doc.getValue();
          const m=c.match(re);
          if(!m||!m.length) return;
          total+=m.length;
          f.doc.setValue(c.replace(re, ()=>replace));
        });
        if(total>0){ toast('✓ Replaced '+total+' occurrence(s)','ok'); addOutput('🔁 Replaced '+total+' occurrence(s)'); persistAll(); close(true); }
        else toast('No matches to replace','warn');
      });
      setTimeout(()=>input.focus(), 40);
    }
  });
}

/* ================================================================
   20. KEYBOARD
   ================================================================ */
function anyOverlayOpen(){
  return !!document.querySelector('.modal-overlay, #palette-overlay, #quickopen-overlay, #context-menu');
}
function initKeyboard(){
  document.addEventListener('keydown', function(e){
    if(e.defaultPrevented) return;
    /* Never hijack keys while an overlay owns focus. */
    if(anyOverlayOpen()) return;

    if(e.altKey && !e.ctrlKey && !e.metaKey && (e.key==='z'||e.key==='Z')){ e.preventDefault(); toggleZenMode(); return; }
    if(e.key==='Escape' && state.zenMode){ toggleZenMode(false); return; }

    const mod=e.ctrlKey||e.metaKey;
    if(!mod){
      if(e.shiftKey && e.altKey && (e.key==='F'||e.key==='f')){ e.preventDefault(); formatActiveFile(); }
      return;
    }
    const k=e.key.toLowerCase();
    if(e.shiftKey && k==='p'){ e.preventDefault(); openCommandPalette(); return; }
    if(e.shiftKey && k==='s'){ e.preventDefault(); saveProject(true); return; }
    if(e.shiftKey && k==='f'){ e.preventDefault(); openProjectSearch(); return; }
    if(e.shiftKey && k==='k'){ e.preventDefault(); const ed=getFocusedEditor(); if(ed) ed.execCommand('deleteLine'); return; }
    if(e.shiftKey && k==='1'){ e.preventDefault(); setFocusedPane(0); if(editor) editor.focus(); return; }
    if(e.shiftKey && k==='2'){ e.preventDefault(); if(!state.splitMode) toggleSplitMode(true); setFocusedPane(1); if(editor2) editor2.focus(); return; }
    if(e.shiftKey && e.key==='Tab'){ e.preventDefault(); cycleTab(-1); return; }
    if(e.shiftKey) return;
    switch(k){
      case 'p': e.preventDefault(); openQuickOpen(); break;
      case 's': e.preventDefault(); saveProject(false); break;
      case 'o': e.preventDefault(); openProjectFlow(); break;
      case 'n': e.preventDefault(); newProjectFlow(); break;
      case 'w': e.preventDefault(); closeActiveTab(); break;
      case 'f': e.preventDefault(); { const ed=getFocusedEditor(); if(ed) ed.execCommand('find'); break; }
      case 'h': e.preventDefault(); { const ed=getFocusedEditor(); if(ed) ed.execCommand('replace'); break; }
      case 'enter': e.preventDefault(); runProject(); break;
      case '\\': e.preventDefault(); toggleSplitMode(); break;
      case '=': case '+': e.preventDefault(); changeFontSize(1); break;
      case '-': e.preventDefault(); changeFontSize(-1); break;
      case '0': e.preventDefault(); settings.fontSize=DEFAULT_SETTINGS.fontSize; applyEditorSettings(); persistSettings(); break;
      case '`': e.preventDefault(); toggleConsolePanel(); break;
      case 'tab': e.preventDefault(); cycleTab(e.shiftKey?-1:1); break;
    }
  }, false);
}

function initLayout(){
  const sidebar=$('#sidebar'), previewRegion=$('#preview-region'), bottomPanel=$('#bottom-panel');
  const mainEl=$('#main'), centerEl=$('#center'), panesEl=$('#editor-panes');
  sidebar.style.flexBasis=(layout.sidebar||220)+'px';
  bottomPanel.style.flexBasis=(layout.consoleH||175)+'px';
  bottomPanel.dataset.collapsed='0';
  if(layout.preview){ previewRegion.style.flexBasis=layout.preview+'px'; previewRegion.style.flexGrow='0'; }
  function startDrag(gutter, measureStart, apply){
    if(!gutter) return;
    gutter.addEventListener('pointerdown', function(e){
      if(e.button !== 0) return;
      e.preventDefault();
      try { gutter.setPointerCapture(e.pointerId); } catch(err){}
      const sx=e.clientX, sy=e.clientY, sv=measureStart();
      document.body.classList.add('resizing');
      function onMove(ev){
        apply(sv, ev.clientX-sx, ev.clientY-sy);
        if(editor) editor.refresh(); if(editor2) editor2.refresh();
      }
      function onUp(){
        gutter.removeEventListener('pointermove', onMove);
        gutter.removeEventListener('pointerup', onUp);
        gutter.removeEventListener('pointercancel', onUp);
        try { gutter.releasePointerCapture(e.pointerId); } catch(err){}
        document.body.classList.remove('resizing');
        if(editor) editor.refresh(); if(editor2) editor2.refresh();
        saveLayout();
      }
      gutter.addEventListener('pointermove', onMove);
      gutter.addEventListener('pointerup', onUp);
      gutter.addEventListener('pointercancel', onUp);
    });
  }
  startDrag($('#gutter-sidebar'), ()=>sidebar.getBoundingClientRect().width, (sw, dx)=>{
    const total=mainEl.clientWidth;
    const w=clamp(sw+dx, 130, Math.max(160, total-320));
    sidebar.style.flexBasis=w+'px'; layout.sidebar=Math.round(w);
  });
  startDrag($('#gutter-main'), ()=>previewRegion.getBoundingClientRect().width, (sw, dx)=>{
    const total=mainEl.clientWidth, sbw=sidebar.getBoundingClientRect().width;
    const w=clamp(sw-dx, 150, Math.max(150, total-sbw-260));
    previewRegion.style.flexBasis=w+'px'; previewRegion.style.flexGrow='0'; layout.preview=Math.round(w);
  });
  startDrag($('#gutter-console'), ()=>bottomPanel.getBoundingClientRect().height, (sh, dx, dy)=>{
    const maxH=Math.max(80, centerEl.clientHeight-120);
    const h=clamp(sh-dy, 0, maxH);
    bottomPanel.style.flexBasis=h+'px';
    bottomPanel.dataset.collapsed=h<24?'1':'0';
    $('#btn-console-toggle').textContent=h<24?'▴':'▾';
    layout.consoleH=Math.round(h);
  });
  startDrag($('#gutter-editor-split'),
    ()=>{ const total=panesEl.clientWidth; if(total<=0) return 0.5; return $('#editor-pane-0').getBoundingClientRect().width/total; },
    (sr, dx)=>{
      const total=panesEl.clientWidth; if(total<=0) return;
      const nr=clamp(sr+dx/total, 0.15, 0.85);
      state.splitRatio=nr;
      $('#editor-pane-0').style.flex=String(nr);
      $('#editor-pane-1').style.flex=String(1-nr);
    });
  window.addEventListener('resize', debounce(()=>{ if(editor) editor.refresh(); if(editor2) editor2.refresh(); }, 120));
}
function resetLayout(){
  layout=Object.assign({}, DEFAULT_LAYOUT);
  state.splitRatio=DEFAULT_LAYOUT.splitRatio;
  $('#sidebar').style.flexBasis=DEFAULT_LAYOUT.sidebar+'px';
  $('#preview-region').style.flexBasis=''; $('#preview-region').style.flexGrow='';
  $('#bottom-panel').style.flexBasis=DEFAULT_LAYOUT.consoleH+'px';
  $('#bottom-panel').dataset.collapsed='0';
  $('#btn-console-toggle').textContent='▾';
  applySplitMode(); saveLayout();
  if(editor) editor.refresh(); if(editor2) editor2.refresh();
}

function showWelcome(){ $('#welcome').classList.remove('hidden'); }
function hideWelcome(){ $('#welcome').classList.add('hidden'); }
function getRecentProjects(){
  try { const r=localStorage.getItem(STORAGE_RECENT); const a=r?JSON.parse(r):[]; return Array.isArray(a)?a:[]; }
  catch(e){ return []; }
}
/* Recent entries carry the project payload when it is small enough to be
   safe to store, and metadata only when it is not. */
function pushRecentProject(){
  let data = null;
  try {
    const payload = serializeProject();
    const json = JSON.stringify(payload);
    data = json.length <= 200000 ? payload : null;
  } catch(e){ data = null; }

  const entry={ name:state.projectName, savedAt:Date.now(), fileCount:state.files.length, data:data };
  let list=getRecentProjects().filter(p=>p&&p.name!==entry.name);
  list.unshift(entry); list=list.slice(0,5);
  try {
    localStorage.setItem(STORAGE_RECENT, JSON.stringify(list));
  } catch(e){
    try {
      const metaOnly = list.map(x=>({ name:x.name, savedAt:x.savedAt, fileCount:x.fileCount, data:null }));
      localStorage.setItem(STORAGE_RECENT, JSON.stringify(metaOnly));
    } catch(e2){ /* give up quietly — recents are not critical */ }
  }
  renderRecentProjects();
}
function renderRecentProjects(){
  const host=$('#recent-list'); if(!host) return;
  const list=getRecentProjects(); host.innerHTML='';
  if(!list.length){ host.innerHTML='<div class="recent-empty">No recent projects yet.</div>'; return; }
  list.forEach(p=>{
    const el=document.createElement('div');
    el.className='recent-item'; el.tabIndex=0; el.setAttribute('role','button');
    el.innerHTML='<span>📁</span><span class="ri-name"></span><span class="ri-meta"></span>';
    el.querySelector('.ri-name').textContent=p.name;
    const meta=(p.fileCount||0)+' files · '+formatTime(p.savedAt||Date.now());
    el.querySelector('.ri-meta').textContent = p.data ? meta : (meta + ' · not restorable');
    const open=()=>{
      if(p.data){ loadProjectData(p.data); afterProjectLoaded('Opened recent project: '+p.name); toast('✓ Opened '+p.name,'ok'); }
      else toast('This project is too large to restore from recents — open the saved file instead.','warn');
    };
    el.addEventListener('click', open);
    el.addEventListener('keydown', e=>{ if(e.key==='Enter') open(); });
    host.appendChild(el);
  });
}

   ================================================================ */
function formatFileContents(name, src){
  const k = kindOf(name);
  const t = typeOf(name);
  if(!t.format) return null;
  if(k==='html'){
    if(typeof window.html_beautify==='function' && !window.__beautifyHTMLFailed)
      return window.html_beautify(src, { indent_size:settings.tabSize, wrap_line_length:0, preserve_newlines:true, extra_liners:[] });
    return null;
  }
  if(k==='css'){
    if(typeof window.css_beautify==='function' && !window.__beautifyCSSFailed)
      return window.css_beautify(src, { indent_size:settings.tabSize });
    return null;
  }
  if(k==='json'){
    try { return JSON.stringify(JSON.parse(src), null, settings.tabSize); } catch(e){ return null; }
  }
  if(k==='javascript'){
    if(typeof window.js_beautify==='function' && !window.__beautifyJSFailed)
      return window.js_beautify(src, { indent_size:settings.tabSize, preserve_newlines:true, keep_array_indentation:false });
    return null;
  }
  return null;
}
/* The lightweight formatters were regex-based and could mangle valid code.
   When no real formatter is available we decline rather than risk it. */
function formatActiveFile(){
  const f=activeFile(), ed=getFocusedEditor();
  if(!f||!ed){ toast('No file open','warn'); return; }
  if(!cmAvailable){ toast('Editor unavailable','warn'); return; }
  const src=ed.getValue();
  const out=formatFileContents(f.name, src);
  if(out===null){ toast('Formatter unavailable for this file — check your connection.','warn'); return; }
  if(out===src){ toast('Already formatted','ok'); return; }
  const cur=ed.getCursor();
  ed.replaceRange(out, {line:0, ch:0}, {line:ed.lineCount(), ch:0});
  try { ed.setCursor({ line:Math.min(cur.line, ed.lineCount()-1), ch:0 }); } catch(e){}
  toast('✨ Formatted '+baseName(f.name),'ok');
}
function formatAllFiles(){
  let n = 0;
  state.files.forEach(f=>{
    const out = formatFileContents(f.name, f.doc.getValue());
    if(out !== null && out !== f.doc.getValue()){ f.doc.setValue(out); n++; }
  });
  return n;
}

/* Static member lists for common built-ins — used for `.` completions. */
const JS_MEMBERS = {
  console: ['log','info','warn','error','debug','table','dir','group','groupEnd','time','timeEnd','count','assert','clear','trace'],
  document: ['getElementById','getElementsByClassName','getElementsByTagName','querySelector','querySelectorAll','createElement','createTextNode','createDocumentFragment','appendChild','insertBefore','removeChild','addEventListener','removeEventListener','body','head','documentElement','title','cookie','readyState','location','write'],
  window: ['alert','confirm','prompt','setTimeout','clearTimeout','setInterval','clearInterval','requestAnimationFrame','cancelAnimationFrame','addEventListener','removeEventListener','getComputedStyle','matchMedia','scrollTo','scrollBy','open','close','focus','blur','print','localStorage','sessionStorage','location','history','navigator','innerWidth','innerHeight','scrollX','scrollY','devicePixelRatio','document','console','name','self','top','parent'],
  localStorage: ['getItem','setItem','removeItem','clear','key','length'],
  sessionStorage: ['getItem','setItem','removeItem','clear','key','length'],
  Math: ['abs','ceil','floor','round','max','min','random','pow','sqrt','sign','trunc','log','exp','sin','cos','tan','hypot','PI','E'],
  JSON: ['parse','stringify'],
  Object: ['keys','values','entries','assign','freeze','create','defineProperty','getOwnPropertyNames','fromEntries'],
  Array: ['isArray','from','of'],
  String: ['fromCharCode','fromCodePoint','raw'],
  Number: ['isInteger','isFinite','isNaN','parseFloat','parseInt','MAX_SAFE_INTEGER','MIN_SAFE_INTEGER'],
  Promise: ['resolve','reject','all','allSettled','race','any'],
  Date: ['now','parse','UTC'],
  navigator: ['userAgent','language','platform','onLine','clipboard','geolocation'],
  location: ['href','pathname','search','hash','assign','replace','reload']
};
function jsMemberList(expr){
  return JS_MEMBERS[expr] || JS_MEMBERS[expr.split('.')[0]] || null;
}

/* Combined hint provider: language helper + words from the document +
   static member lists after ".". */
function nibirHint(cm, options){
  const f = getFile(docFileId(cm));
  if(!f) return null;
  const kind = kindOf(f.name);
  if(kind === 'text') return null;

  const cur = cm.getCursor();
  const before = cm.getLine(cur.line).slice(0, cur.ch);

  /* 1) Member completion after "obj." for JavaScript */
  if(kind === 'javascript'){
    const dot = before.match(/([A-Za-z_$][\w$]*(?:\.[A-Za-z_$][\w$]*)*)\.([\w$]*)$/);
    if(dot){
      const members = jsMemberList(dot[1]);
      if(members && members.length){
        return {
          list: members.slice().sort((a,b)=>a.localeCompare(b)),
          from: CodeMirror.Pos(cur.line, cur.ch - dot[2].length),
          to: cur
        };
      }
    }
  }

  /* 2) Plain word completion */
  const wordMatch = /[A-Za-z_$][\w$]*$/.exec(before);
  const prefix = wordMatch ? wordMatch[0] : '';
  const from = wordMatch ? CodeMirror.Pos(cur.line, cur.ch - prefix.length) : cur;

  /* If the user just typed "." and we have no member list, don't flood them. */
  if(!prefix && /\.$/.test(before)) return null;

  const bag = new Set();

  /* Language-specific hint helper */
  let helper = null;
  if(kind === 'javascript' || kind === 'json') helper = CodeMirror.hint.javascript;
  else if(kind === 'css')  helper = CodeMirror.hint.css;
  else if(kind === 'html') helper = CodeMirror.hint.html;

  if(helper){
    try {
      const r = helper(cm, Object.assign({}, options, { completeSingle:false }));
      if(r && r.list) r.list.forEach(it => {
        const t = typeof it === 'string' ? it : (it && it.text) || '';
        if(t) bag.add(t);
      });
    } catch(e){}
  }

  /* Words already present in the document (anyword) */
  if(CodeMirror.hint.anyword){
    try {
      const r = CodeMirror.hint.anyword(cm, Object.assign({}, options, { completeSingle:false }));
      if(r && r.list) r.list.forEach(w => bag.add(w));
    } catch(e){}
  }

  let list = Array.from(bag).filter(Boolean);
  if(prefix){
    const p = prefix.toLowerCase();
    list = list.filter(w => w.length > prefix.length && w.toLowerCase().indexOf(p) === 0);
  }
  if(!list.length) return null;
  list.sort((a,b) => a.localeCompare(b));
  return { list, from, to: cur };
}

/* Attach auto-popup behaviour to a CodeMirror instance. */
function attachAutoHint(ed){
  if(!ed) return;
  let timer = null;
  const cancel = () => { if(timer){ clearTimeout(timer); timer = null; } };

  ed.on('inputRead', function(cm, change){
    if(!change || change.origin !== '+input') return;   /* ignore paste/delete */
    if(cm.state.completionActive) return;               /* popup already open */

    const text = (change.text || []).join('');
    const last = text.slice(-1);
    if(!last) return;
    if(!/[A-Za-z0-9_$]/.test(last) && last !== '.'){ cancel(); return; }

    cancel();
    timer = setTimeout(function(){
      timer = null;
      if(cm.state.completionActive) return;
      const f = getFile(docFileId(cm));
      if(!f || kindOf(f.name) === 'text') return;

      const cur = cm.getCursor();
      const before = cm.getLine(cur.line).slice(0, cur.ch);
      const wm = /[A-Za-z_$][\w$]*$/.exec(before);
      const prefix = wm ? wm[0] : '';
      const justDotted = /\.[\w$]*$/.test(before) && !prefix;

      /* Need at least 2 chars of prefix, or a "." trigger */
      if(prefix.length < 2 && !justDotted) return;

      cm.showHint({
        hint: nibirHint,
        completeSingle: false,
        alignWithWord: true,
        closeOnUnfocus: true
      });
    }, 100);
  });

  /* Esc suppresses re-opening until the user types more */
  ed.getWrapperElement().addEventListener('keydown', function(e){
    if(e.key === 'Escape') cancel();
  }, true);
}

/* ================================================================
   27. STORAGE LOAD
   ================================================================ */
function loadFromStorage(){
  try {
    const raw=localStorage.getItem(STORAGE_PROJECT); if(!raw) return false;
    const data=JSON.parse(raw);
    if(!data||!Array.isArray(data.files)||!data.files.length) return false;
    loadProjectData(data);
    return true;
  } catch(err){ return false; }
}

/* ================================================================
   28. INIT
   ================================================================ */
function init(){
  try {
    loadSettings();
    document.body.dataset.theme=settings.theme;
    initEditor();
    applyEditorSettings();
    bindUI();
    initTreeDelegation();
    initLayout();
    initKeyboard();
    renderRecentProjects();
    rebuildProblems();
    renderOutput();
    const restored=loadFromStorage();
    if(!restored){
      loadProjectData({ projectName:'My Project', files:SAMPLE_PROJECT.files });
      setSaveStatus('Ready','');
      showWelcome();
    } else {
      setSaveStatus('Restored','saved');
      addOutput('↺ Restored previous session');
    }
    applySplitMode();
    renderAllTabs();
    updatePaneEmptyHints();
    updateStatusBar();
    updateDocTitle();
    setTimeout(runProject, 120);
    setTimeout(()=>{ if(editor) editor.refresh(); if(editor2) editor2.refresh(); }, 260);
    addOutput('⚡ Nibir Code Runner ready'+(state.splitMode?' (split view)':''));
    if(!cmAvailable) addOutput('⚠ CodeMirror unavailable — editor disabled, preview and project tools still work.');
  } catch(err){
    console.error(err);
    const h0=$('#editor-host-0');
    if(h0) h0.innerHTML='<div id="editor-fallback">⚠ Initialisation failed: '+(err&&err.message?escapeHtml(err.message):'unknown error')+'</div>';
  }
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init);
else init();

})();
</script>
